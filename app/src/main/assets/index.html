/* ---------- Work through it ---------- */
const WT_PROMPTS=[
 ['Say it out loud','What\'s bothering you? Say it out loud, just as it comes. It doesn\'t need to make sense yet.'],
 ['Again, more specific','Say it again, but narrower. What exactly is the problem? Leave out the extra noise.'],
 ['One thing, about you','Last time. Make it one single thing, and make it about you. Try starting with "The problem for me is…"']];
let WT=null,REC=null,WT_PENDING=false;
function nowStamp(){const n=new Date();return dk(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())}
function wtStart(o){
  closeSheet();
  WT={id:uid(),date:todayK(),at:nowStamp(),rounds:[0,1,2].map(()=>({audioId:'',text:''})),sol:{audioId:'',text:''},step:0,o:o||null,done:false};
  renderWT(false);
}
function wtSlot(){return WT.step<3?WT.rounds[WT.step]:WT.sol}
function wtHas(){return WT.rounds.some(r=>r.audioId||r.text.trim())||WT.sol.audioId||WT.sol.text.trim()}
function wtPersist(){
  if(!WT||!wtHas())return;
  const rec={id:WT.id,date:WT.date,at:WT.at,rounds:WT.rounds,sol:WT.sol,done:WT.done};
  const i=S.data.wt.findIndex(x=>x.id===WT.id);if(i>=0)S.data.wt[i]=rec;else S.data.wt.push(rec);
  save();
}
function wtDots(){const L=['1','2','3','Solve','Breathe'];return `<div class="row" style="gap:5px;margin:-6px 0 12px;flex-wrap:wrap">${L.map((l,i)=>`<span class="pill ${i<WT.step?'p-done':i===WT.step?'p-due':'p-up'}">${i<WT.step?'✓ ':''}${l}</span>`).join('')}</div>`}
function hearLink(r,label){if(!r||(!r.audioId&&!r.text))return '';return `<div class="tiny muted" style="margin-bottom:8px">${label}: ${r.text?'“'+esc(r.text)+'” ':''}${r.audioId?`<button class="tiny" style="color:var(--coral);text-decoration:underline;padding:0" onclick="playA('${r.audioId}')">▶ hear it</button>`:''}</div>`}
function recBox(slot){
  const on=REC&&REC.on;
  let h=`<div class="card" style="text-align:center;padding:20px 14px">`;
  if(on)h+=`<button class="recbtn on" onclick="recStop()">■</button><div style="margin-top:10px;font-weight:700" id="rect">Recording… 0:00</div><div class="tiny muted">Tap to stop</div>`;
  else if(slot.audioId)h+=`<div style="font-size:30px">🎙️</div><div class="small" style="margin:4px 0 10px">Recorded</div><div class="row" style="justify-content:center;gap:10px"><button class="btn sm sec2" onclick="playA('${slot.audioId}')">▶ Play back</button><button class="btn sm ghost" onclick="recStart()">Re-record</button></div>`;
  else h+=`<button class="recbtn" onclick="recStart()">🎙️</button><div style="margin-top:10px;font-weight:700">Tap to record</div><div class="tiny muted">Say it out loud</div>`;
  h+=`</div><label class="f">Or write it down too (optional)</label><textarea class="inp" rows="3" oninput="wtSlot().text=this.value;wtReady()" placeholder="${WT.step<3?'The problem is…':'One thing I can do is…'}">${esc(slot.text)}</textarea>`;
  return h;
}
function wtReady(){const b=document.getElementById('wtn');if(!b||!WT||WT.step>=4)return;const sl=wtSlot();b.disabled=!((sl.audioId||sl.text.trim())&&!(REC&&REC.on))}
function renderWT(keep=true){
  if(!WT)return;
  const st=WT.step;
  let h=`<h3>🧭 Work through it</h3>`+wtDots();
  if(st===0)h+=`<p class="small muted" style="margin-top:0">Get it out of your head. Say the problem out loud three times, each time more specific and more about you. Then find one thing you can do. Then breathe.</p>`;
  if(st<3){
    const [t,p]=WT_PROMPTS[st];
    h+=`<div class="serif" style="font-size:20px;margin:4px 0 4px">${st+1}. ${t}</div><p class="small" style="margin-top:0">${esc(p)}</p>`;
    if(st>0)h+=hearLink(WT.rounds[st-1],'Last time');
    h+=recBox(WT.rounds[st]);
  } else if(st===3){
    h+=`<div class="serif" style="font-size:20px;margin:4px 0 4px">Now, the solution</div><p class="small" style="margin-top:0">You've narrowed it down to one thing. What's one thing you can do about it? Small and doable beats perfect.</p>`;
    h+=hearLink(WT.rounds[2],'Your problem');
    h+=recBox(WT.sol);
    h+=`<button class="btn ghost sm" style="margin-top:10px" onclick="wtToTask()">+ Turn it into a task</button>`;
  } else {
    h+=`<div class="serif" style="font-size:20px;margin:4px 0 4px">Now breathe</div><p class="small" style="margin-top:0">You've named it and you've got a plan. Let your body catch up.</p>`+hearLink(WT.sol,'Your plan')+breathWidget('wt');
  }
  h+=`<div class="btns">${st<4?`<button class="btn" id="wtn" onclick="wtNext()">${st<3?'Next':'On to breathing'}</button>`:`<button class="btn" onclick="wtFinish()">Finish${WT.o?' and tick off':''}</button>`}
    ${st>0?`<button class="btn ghost" onclick="wtBack()">Back</button>`:`<button class="btn ghost" onclick="closeSheet()">Not now</button>`}</div>`;
  openSheet(h,wtCleanup,keep);
  wtReady();
}
function recStart(){
  if(BR){
    const r=BR.startRecording();
    if(r==='perm'){WT_PENDING=true;toast('Allow the microphone so you can record');return}
    if(r!=='ok'){toast('Couldn\'t start recording');return}
  }
  REC={on:true,t0:Date.now()};renderWT();
  REC.iv=setInterval(()=>{const el=document.getElementById('rect');if(!el||!REC)return;const s=Math.floor((Date.now()-REC.t0)/1000);el.textContent='Recording… '+Math.floor(s/60)+':'+pad(s%60)},500);
}
window.onMicPermission=g=>{if(g&&WT_PENDING){WT_PENDING=false;recStart()}else if(!g){WT_PENDING=false;toast('No microphone access. You can still write it down.')}};
function useRec(id){
  if(REC){clearInterval(REC.iv);REC=null}
  if(!WT)return;
  if(!id){toast('That was too short, try again');return}
  const sl=wtSlot();if(sl.audioId&&sl.audioId!==id)delAudio(sl.audioId);sl.audioId=id;wtPersist();
}
function recStop(){
  const id=BR?BR.stopRecording():'a'+uid();
  useRec(id);renderWT();
}
window.onRecStopped=id=>{if(REC&&REC.on){useRec(id);if(WT&&S.sheetOpen)renderWT()}};
window.onAudioEnded=()=>{};
function playA(id){if(BR)BR.playAudio(id);else toast('▶ plays on the phone')}
function delAudio(id){if(!id)return;try{BR&&BR.deleteAudio(id)}catch(e){}}
function wtCleanup(){
  if(REC&&REC.on){clearInterval(REC.iv);REC=null;try{BR&&BR.cancelRecording()}catch(e){}}
  try{BR&&BR.stopAudio()}catch(e){}
  wtPersist();
}
function wtNext(){
  const sl=wtSlot();if(!(sl.audioId||sl.text.trim())){toast('Record it or write it first');return}
  try{BR&&BR.stopAudio()}catch(e){}
  WT.step++;wtPersist();renderWT(false);
}
function wtBack(){try{BR&&BR.stopAudio()}catch(e){}WT.step--;renderWT(false)}
function wtToTask(){
  wtPersist();
  const keep=WT;
  const name=(WT.sol.text.trim()||'My next step').slice(0,60);
  S.onClose=null;
  editTask(null,null,dk(addDays(new Date(),1)));
  TE.name=name;TE.emoji='🧭';TE.type='other';renderTE(false);
  window.__afterTask=()=>{WT=keep;WT.step=3;renderWT(false)};
}
function wtFinish(){
  WT.done=true;wtPersist();
  const o=WT.o;WT=null;closeSheet();
  if(o&&!findComp(o.task.id,o.date,o.slot)){
    if(photoRequired(o.date)){openComplete(o);return}
    S.data.completions.push({id:uid(),taskId:o.task.id,date:o.date,slot:o.slot,at:nowStamp()+':00',photoId:null,note:'Worked through it first'});save();
  }
  render();toast('Well done. That took guts 🌿');
}
function wtView(id){
  const w=S.data.wt.find(x=>x.id===id);if(!w)return;
  const row=(lbl,r)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="tiny muted" style="font-weight:700">${lbl}</div>
    ${r.text?`<div style="margin:3px 0">${esc(r.text)}</div>`:''}${r.audioId?`<button class="btn sm sec2" style="margin-top:6px" onclick="playA('${r.audioId}')">▶ Play</button>`:''}${!r.text&&!r.audioId?'<div class="small muted">–</div>':''}</div>`;
  openSheet(`<h3>🧭 ${relDay(w.date)}</h3><div class="muted small" style="margin-top:-8px">${fmtTime(w.at.slice(11,16))}${w.done?'':' · unfinished'}</div>

function wtDel(id){
  if(!confirmTap('wd'+id,'Tap again to delete'))return;

function guessCountry(){
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  const lang=(navigator.language||'').toUpperCase();
  if(tz.startsWith('Australia/'))return 'AU';
  if(tz==='Pacific/Auckland'||tz==='Pacific/Chatham')return 'NZ';
  if(tz==='Europe/London')return 'GB';
  if(tz==='Europe/Dublin')return 'IE';
  if(/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|St_Johns|Regina|Moncton|Whitehorse|Yellowknife|Iqaluit|Glace_Bay|Goose_Bay|Swift_Current)/.test(tz)||lang.endsWith('-CA'))return 'CA';
  if(/^(America\/|Pacific\/Honolulu)/.test(tz)&&lang.endsWith('-US'))return 'US';
  const m=lang.match(/-([A-Z]{2})$/);if(m&&HELP[m[1]==='UK'?'GB':m[1]])return m[1]==='UK'?'GB':m[1];
  if(tz.startsWith('America/'))return 'US';
  return 'XX';
}
function country(){const c=S.data.settings.country;return HELP[c]?c:guessCountry()}

let BT=null;
function breathWidget(key){
  return `<div class="card" style="margin-top:14px"><div class="breath"><div class="orb" id="orb"></div><div class="lbl" id="blbl"><b>Box breathing</b><span class="small">4 in · 4 hold · 4 out · 4 hold</span></div></div>
    <div class="chips" style="justify-content:center;margin-bottom:10px">${[2,4,6].map(r=>`<button class="chip ${(S.br||4)===r?'on':''}" onclick="S.br=${r};document.querySelectorAll('.brr').forEach(b=>b.classList.remove('on'));this.classList.add('on')" >${r} rounds</button>`).join('').replace(/class="chip/g,'class="brr chip')}</div>
    <button class="btn sec2" id="bgo" onclick="breathStart()">Start</button></div>`;

function breathStop(){if(BT){clearInterval(BT);BT=null}}
function breathStart(){
  breathStop();
  const orb=document.getElementById('orb'),lbl=document.getElementById('blbl'),go=document.getElementById('bgo');
  if(!orb)return;
  const phases=[['Breathe in',1],['Hold',1],['Breathe out',.55],['Hold',.55]];
  const rounds=S.br||4;let step=0,sec=4;
  go.disabled=true;go.textContent='Breathing…';
  const show=()=>{const [name,sc]=phases[step%4];orb.style.transform=`scale(${sc})`;lbl.innerHTML=`<b>${name}</b><span>${sec}</span><div class="tiny">Round ${Math.floor(step/4)+1} of ${rounds}</div>`};
  show();
  BT=setInterval(()=>{
    if(!document.getElementById('orb')){breathStop();return}
    sec--;
    if(sec<=0){step++;sec=4;if(step>=rounds*4){breathStop();orb.style.transform='scale(.75)';lbl.innerHTML='<b>Nice.</b><span class="small">Notice how you feel.</span>';go.disabled=false;go.textContent='Go again';return}}
    show();
  },1000);
}
function openBreathe(){openSheet(`<h3>🌬️ Breathe</h3><p class="small muted" style="margin-top:-6px">Follow the circle. In through the nose, out through the mouth.</p>${breathWidget('free')}<div class="btns"><button class="btn ghost" onclick="closeSheet()">Done</button></div>`)}
function moodChart(){
  const days=30,end=new Date(),W=320,H=140,P=22;
  const pts=[];for(let i=days-1;i>=0;i--){const k=dk(addDays(end,-i)),m=moodFor(k);if(m)pts.push([days-1-i,m.score,k])}
  if(!pts.length)return '<p class="small muted">Check in on the Today screen and your mood shows up here over time.</p>';
  const x=i=>P+i/(days-1)*(W-P*2),y=v=>H-P-(v-1)/4*(H-P*2);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for(let v=1;v<=5;v++)s+=`<line x1="${P}" x2="${W-P/2}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EEEA"/><text x="2" y="${y(v)+5}" font-size="12">${MOODS[v-1]}</text>`;
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="#9C8FD0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p=>{s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4.5" fill="#fff" stroke="#5E8C83" stroke-width="2.5"/>`});
  s+=`<text x="${P}" y="${H-4}" font-size="10" fill="#6C7D78">${fmtDate(dk(addDays(end,-(days-1))),false)}</text><text x="${W-P/2}" y="${H-4}" font-size="10" fill="#6C7D78" text-anchor="end">today</text>`;

/* ---------- steps ---------- */
let STEPS_AFTER=null;
function stepsInfo(){if(!BR||!BR.stepsStatus)return S.demoSteps||{available:false};try{return JSON.parse(BR.stepsStatus())}catch(e){return {available:false}}}
function stepsOnNow(){const i=stepsInfo();return !!(i.available&&i.enabled&&i.permission)}
function stepsToday(){const i=stepsInfo();return i.enabled?(i.today||0):0}
function stepsHist(){const i=stepsInfo(),h=Object.assign({},S.data.stepsHist||{});for(const k in (i.hist||{}))h[k]=Math.max(h[k]||0,i.hist[k]);if(i.enabled)h[todayK()]=i.today||0;return h}
function fmtN(n){return Math.round(n||0).toLocaleString('en-AU')}
function kFmt(n){return n>=1000?(Math.round(n/100)/10)+'k':String(n)}
/* turn the step counter on (asks for "Physical activity" permission the first time), then run after() */
function stepsOn(after){
  if(!BR||!BR.stepsEnable){toast('Step counting works in the app on your phone');return}
  if(stepsOnNow()){if(after)after();return}
  STEPS_AFTER=after||null;BR.stepsEnable(true);
}
window.onStepsEnabled=()=>{const f=STEPS_AFTER;STEPS_AFTER=null;if(f)f();else if(!S.sheetOpen)render();window.onSteps()};

/* walks: a "move" task with step counting on. Start walk → count → Finish walk */
function walkCounting(t){return t.type==='move'&&!!t.stepMode&&(stepsInfo().available||!BR)}
function walkKey(o){return o.task.id+'|'+o.date+'|'+o.slot}
function walkFor(o){return (S.data.walks||{})[walkKey(o)]||null}
function walkSteps(w){
  if(!w||w.base==null)return 0;
  const td=todayK();
  if(w.day===td)return Math.max(0,stepsToday()-w.base);
  const h=stepsHist();let n=Math.max(0,(h[w.day]||0)-w.base),d=dk(addDays(parseDk(w.day),1)),guard=0;
  while(d<=td&&guard++<8){n+=d===td?stepsToday():(h[d]||0);d=dk(addDays(parseDk(d),1))}
  return n;
}
function walkMins(w){const a=new Date(w.start.replace(' ','T'));return Math.max(0,Math.round((Date.now()-a.getTime())/60000))}
function walkStart(){
  if(!CF)return;const o=CF.o;
  stepsOn(()=>{
    if(!stepsOnNow()){renderComplete();return}
    S.data.walks[walkKey(o)]={start:nowStamp()+':'+pad(new Date().getSeconds()),day:todayK(),base:BR&&BR.stepsSample?null:stepsToday()};
    save();
    if(BR&&BR.stepsSample)BR.stepsSample();
    if(CF)renderComplete();render();
    toast('Walk started. Pop your phone in your pocket 🚶');
  });
}
function walkCancel(){
  if(!CF)return;
  if(!confirmTap('wc','Tap again to cancel the walk'))return;
  delete S.data.walks[walkKey(CF.o)];save();renderComplete();render();
}
function walkBar(n,g){return `<div style="height:10px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden"><div id="wkBar" style="height:100%;width:${Math.min(100,n/g*100)}%;background:${n>=g?'var(--green)':'var(--coral)'};border-radius:9px;transition:width .4s"></div></div>`}
function walkGoalTxt(n,g){return n>=g?'<b style="color:var(--green)">Goal reached 🎉</b>':fmtN(g-n)+' to go'}
function walkCard(o,w){
  const t=o.task,g=t.stepMode==='goal'?t.stepGoal:0;
  if(!w)return `<div class="card" style="margin-top:14px;text-align:center">
    <div style="font-size:30px">👣</div><div style="font-weight:700;margin-top:2px">${g?'Goal: '+fmtN(g)+' steps':'Count this walk'}</div>
    <div class="tiny muted" style="margin:4px 0 12px">Tap start, put your phone in your pocket and go. Steps keep counting with the screen off.</div>
    <button class="btn" onclick="walkStart()">▶ Start walk</button></div>`;
  const n=walkSteps(w),mins=walkMins(w);
  return `<div class="card" style="margin-top:14px">

    <div style="margin-top:4px"><span id="wkNow" style="font-size:40px;font-weight:800">${w.base==null?'…':fmtN(n)}</span> <span class="muted">steps</span></div>
    ${g?walkBar(n,g)+`<div class="small muted" style="margin-top:6px" id="wkTxt">${walkGoalTxt(n,g)} · goal ${fmtN(g)}</div>`:`<div class="small muted" style="margin-top:2px">Just counting. Every step counts 🌿</div>`}</div>`;
}
function walkDoneCard(w){
  const hit=w.goal&&w.steps>=w.goal;
  return `<div class="card" style="padding:12px;text-align:center"><div style="font-size:28px;font-weight:800">👣 ${fmtN(w.steps)} <span class="small muted" style="font-weight:400">steps</span></div>
    <div class="small muted">${[w.mins?w.mins+' min':'',w.goal?'goal '+fmtN(w.goal)+(hit?' ✓':''):''].filter(Boolean).join(' · ')}</div></div>`;

/* live updates from the phone's step sensor */
window.onSteps=()=>{
  let ch=false;
  for(const k in (S.data.walks||{})){const w=S.data.walks[k];if(w.base==null){w.base=stepsToday();ch=true}}
  if(ch)save();
  document.querySelectorAll('[data-walk]').forEach(el=>{const w=S.data.walks[el.dataset.walk];if(w)el.textContent=fmtN(walkSteps(w))});
  const st=document.getElementById('stToday');if(st)st.textContent=fmtN(stepsToday());
  if(CF&&S.sheetOpen){
    const w=walkFor(CF.o);const a=document.getElementById('wkNow');
    if(w&&a){const n=walkSteps(w),t=CF.o.task,g=t.stepMode==='goal'?t.stepGoal:0;
      a.textContent=fmtN(n);
      const m=document.getElementById('wkMins');if(m)m.textContent=walkMins(w)+' min';
      if(g){const b=document.getElementById('wkBar');if(b){b.style.width=Math.min(100,n/g*100)+'%';b.style.background=n>=g?'var(--green)':'var(--coral)'}
        const x=document.getElementById('wkTxt');if(x)x.innerHTML=walkGoalTxt(n,g)+' · goal '+fmtN(g);
        if(n>=g&&!w.hit){w.hit=true;save();toast('🎉 Step goal reached! Keep going or finish up')}}
    }
  }
};
setInterval(()=>{if(CF&&S.sheetOpen&&walkFor(CF.o)){const m=document.getElementById('wkMins');if(m)m.textContent=walkMins(walkFor(CF.o))+' min'}},30000);

    svg+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="${isT?'#5E8C83':'#6C7D78'}" font-weight="${isT?700:400}">${DOW[parseDk(d).getDay()][0]}</text>`});

function proj(id){return (S.data.projects||[]).find(p=>p.id===id)}
function owner(id){return task(id)||proj(id)}
function pSteps(p){return p.items.filter(i=>i.kind==='s')}
function pNext(p){return pSteps(p).find(i=>!i.done)}
function pPct(p){const s=pSteps(p);return s.length?Math.round(100*s.filter(i=>i.done).length/s.length):0}
function syncProjects(){
  for(const p of S.data.projects||[])for(const it of p.items){
    if(it.kind!=='s'||!it.taskId||it.manualOff)continue;
    const c=S.data.completions.filter(c=>c.taskId===it.taskId);
    const t=task(it.taskId);
    if(it.done){if(it.auto&&!c.length&&t){it.done=false;delete it.doneAt;delete it.auto}continue}
    if(c.length&&(!t||t.repeat==='none')){it.done=true;it.auto=true;it.doneAt=c[c.length-1].at.slice(0,10)}
  }
}

function addPItem(pid,kind){
  const p=proj(pid);
  if(kind==='h'){openSheet(`<h3>Add a heading</h3><div class="small muted">Headings split your steps into stages, like "Get set up" or "Find the work". It goes at the bottom, and you can move it after.</div>
     <input class="inp" id="phd" placeholder="e.g. Get set up" style="margin-top:12px" onkeydown="if(event.key==='Enter')savePHead('${pid}')"><div class="btns"><button class="btn" onclick="savePHead('${pid}')">Add heading</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
    setTimeout(()=>{const e=document.getElementById('phd');if(e)e.focus()},250);return}
  const el=document.getElementById('paddstep');const v=(el&&el.value||'').trim();if(!v){if(el)el.focus();return}
  p.items.push({id:uid(),kind:'s',text:v,done:false});save();render();
  const e2=document.getElementById('paddstep');if(e2)e2.focus();
}
function savePHead(pid){const v=(document.getElementById('phd').value||'').trim();if(!v)return;proj(pid).items.push({id:uid(),kind:'h',text:v});save();closeSheet();render()}
function togglePItem(pid,iid){
  const p=proj(pid),it=p.items.find(i=>i.id===iid);if(!it)return;
  it.done=!it.done;delete it.auto;if(it.done){it.doneAt=todayK();delete it.manualOff}else{delete it.doneAt;if(it.taskId)it.manualOff=true}
  save();render();

  if(S.sheetOpen&&PI&&PI.iid===iid)openPItem(pid,iid,true);

function frCap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)}

function frYour(t){t=String(t);return /^my\b/i.test(t)?t.replace(/^my\b/i,'your'):(FR_TOPICS.includes(t)?t.charAt(0).toLowerCase()+t.slice(1):t)}

  if(TE.id){const i=S.data.tasks.findIndex(x=>x.id===TE.id);keepHistory(S.data.tasks[i],TE);S.data.tasks[i]=TE}
  else{TE.id=uid();TE.active=true;S.data.tasks.push(TE)}
  save();closeSheet();render();toast('Saved. Reminders are set');
  if(window.__afterTask){const f=window.__afterTask;window.__afterTask=null;f()}
}
function delTask(id){
  if(!confirmTap('dt'+id,'Tap again to delete'))return;
  const t=task(id);
  if(S.data.completions.some(c=>c.taskId===id)){const cut=keepHistory(t,t,true);t.end=cut;t.active=false}  // keep history
  else{(t.files||[]).forEach(f=>deletePhoto(f.photoId));dropDocs(t);S.data.tasks=S.data.tasks.filter(x=>x.id!==id)}
  save();closeSheet();render();toast('Deleted');
}

/* ---------- Settings ---------- */
function openSettings(){
  const s=S.data.settings;
  let perm='';
  try{if(BR)perm=`<div class="small" style="margin-top:8px">${BR.notificationsEnabled()?'✅ Notifications allowed':'⚠️ Notifications blocked'} · ${BR.exactAlarmsAllowed()?'✅ On-time alarms':'⚠️ Alarms may be late'}</div>`}catch(e){}
  const ph=s.photoProof?`<div class="row between"><div><b>Photo proof is ON</b><div class="tiny muted">Every task needs a photo to tick off</div></div><span class="pill p-done">On</span></div>
      <button class="btn ghost sm" style="margin-top:12px" onclick="photoOffStep1()">Turn off photo proof…</button>`
    :photoPending()?`<div><b>Photo proof switches off tomorrow</b><div class="tiny muted">Changed your mind? It's not too late.</div></div><button class="btn" style="margin-top:12px" onclick="photoOn()">Keep photo proof on</button>`
    :`<div class="row between"><div><b>Photo proof is OFF</b><div class="tiny muted">Tasks tick off with one tap. Turn this on if you want proof.</div></div><span class="pill p-up">Off</span></div><button class="btn" style="margin-top:12px" onclick="photoOn()">Turn photo proof back on</button>`;
  let ver='';try{if(BR)ver=BR.appVersion()}catch(e){}
  openSheet(`<h3>Settings</h3>
   <div class="card"><label class="f" style="margin-top:0">Your name</label><input class="inp" value="${esc(s.name)}" placeholder="Your name" onchange="S.data.settings.name=this.value.trim();save();render()"></div>
   <div class="card"><h2>🔔 Reminders</h2><div class="small muted">If a task isn't ticked off, keep nudging every:</div>
     <div class="chips" style="margin-top:8px">${[15,30,60].map(m=>`<button class="chip ${s.nagMinutes===m?'on':''}" onclick="setS('nagMinutes',${m})">${m} min</button>`).join('')}</div>
     <div class="small muted" style="margin-top:12px">Extra nudges per task:</div>
     <div class="chips" style="margin-top:8px">${[2,4,6].map(m=>`<button class="chip ${s.nagMax===m?'on':''}" onclick="setS('nagMax',${m})">${m}</button>`).join('')}</div>
     ${perm}${BR?`<button class="btn ghost sm" style="margin-top:12px" onclick="Android.testNotification()">Send a test reminder</button>`:''}</div>
   <div class="card"><h2>📷 Photo proof</h2>${ph}</div>
   ${stepsSettingsCard()}
   <div class="card"><h2>🌏 Country</h2><div class="small muted" style="margin-bottom:8px">Sets which support lines show in the Mind tab.</div>${countrySelect(country(),"setCountry(this.value)")}</div>
   <div class="card"><h2>🎁 Rewards</h2><label class="f" style="margin-top:0">Someone else gives the rewards? (optional)</label><input class="inp" value="${esc(s.giver||'')}" placeholder="Leave blank to treat yourself" onchange="S.data.settings.giver=this.value.trim();save();render()"></div>
   <div class="card"><h2>💾 Backup</h2><div class="small muted">Everything lives only on this phone, private to you. Save a backup file now and then (Google Drive, email it to yourself, etc.) so nothing's lost if the phone dies.</div>
     <div class="small" style="margin-top:8px">Last backup: <b>${s.lastBackup?fmtDate(s.lastBackup):'never'}</b></div>
     ${BR?`<div class="btns" style="margin-top:12px"><button class="btn sec2" onclick="Android.exportBackup()">Save backup file</button><button class="btn ghost" onclick="restoreAsk()">Restore from backup…</button></div>`
       :`<button class="btn sec2" style="margin-top:12px" onclick="browserExport()">Download backup</button>`}</div>
   <div class="tiny muted" style="text-align:center;margin-top:6px">Steady ${esc(ver)} · one small step at a time</div>`);
}
function setS(k,v){S.data.settings[k]=v;save();openSettings()}
function restoreAsk(){if(!confirmTap('rs','Restoring replaces everything on this phone. Tap again to choose a file'))return;Android.importBackup()}
window.onBackupDone=(kind,ok,msg)=>{
  if(kind==='export'&&ok){S.data.settings.lastBackup=todayK();save();toast('Backup saved ✓');if(S.sheetOpen)openSettings()}
  else if(!ok&&msg)toast(msg);
};
function browserExport(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S.data));a.download='steady-backup.json';a.click();S.data.settings.lastBackup=todayK();save()}
function photoOn(){S.data.settings.photoProof=true;S.data.settings.photoOffFrom=null;save();openSettings();render();toast('Photo proof is on 📷')}
function photoOffStep1(){
  openSheet(`<h3>Turn off photo proof?</h3>
   <p>Photo proof is what makes ticking things off <i>count</i>. Before you switch it off, ask yourself: am I just annoyed right now?</p>
   <p class="small muted">If you go ahead it won't switch off until <b>tomorrow</b>, so today's tasks still need a photo.</p>
   <div class="btns"><button class="btn" onclick="openSettings()">Keep it on</button><button class="btn ghost" onclick="photoOffStep2()">I still want to turn it off</button></div>`);
}
let holdT=null;
function photoOffStep2(){
  openSheet(`<h3>Hold to confirm</h3><p class="muted">Press and hold for 5 seconds.</p>
   <div class="hold" id="hold"><div class="fill" id="hfill"></div><span id="htxt">Hold to turn off photo proof</span></div>
   <div class="btns"><button class="btn" onclick="openSettings()">Never mind, keep it on</button></div>`);
  const el=document.getElementById('hold'),fill=document.getElementById('hfill');
  let t0=0,raf=0;
  const stop=()=>{cancelAnimationFrame(raf);t0=0;fill.style.width='0';document.getElementById('htxt').textContent='Hold to turn off photo proof'};
  const tick=()=>{const p=Math.min(1,(Date.now()-t0)/5000);fill.style.width=(p*100)+'%';document.getElementById('htxt').textContent=p<1?'Keep holding… '+Math.ceil(5-p*5):'OK';if(p>=1){photoOffStep3();return}raf=requestAnimationFrame(tick)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();t0=Date.now();raf=requestAnimationFrame(tick)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
const PHRASE='I will still do my tasks';
function photoOffStep3(){
  openSheet(`<h3>Last step</h3><p>Type this to confirm:</p><p style="font-weight:700;font-size:18px">“${PHRASE}”</p>
   <input class="inp" id="phr" autocomplete="off" oninput="document.getElementById('phok').disabled=this.value.trim().toLowerCase().replace(/[.!]$/,'')!=='${PHRASE.toLowerCase()}'">
   <div class="btns"><button class="btn danger" id="phok" disabled onclick="photoOffDo()">Turn off from tomorrow</button><button class="btn" onclick="openSettings()">Keep it on</button></div>`);
}
function photoOffDo(){
  S.data.settings.photoProof=false;S.data.settings.photoOffFrom=dk(addDays(new Date(),1));
  save();openSettings();render();toast('Photo proof turns off tomorrow');
}

/* ---------- Onboarding ---------- */
let OB=null;
function viewOnboard(){
  if(!OB)OB={name:S.data.settings.name||'',picks:{0:true,1:true,2:true,3:false},times:{0:'17:30',1:'07:00',2:'21:00',3:'21:30'},mantra:''};
  const st=TEMPLATES.slice(0,4).map((tp,i)=>`<div class="starter ${OB.picks[i]?'on':''}">
    <button class="check" onclick="OB.picks[${i}]=!OB.picks[${i}];render()">${OB.picks[i]?'✓':''}</button>
    <div class="grow" style="flex:1"><div class="row between"><b>${tp.emoji} ${tp.name}</b><input class="inp" type="time" style="width:120px;padding:8px" value="${OB.times[i]}" onchange="OB.times[${i}]=this.value"></div>
    <div class="small muted" style="margin-top:4px">Every day${tp.notes?' · '+tp.notes:''}</div></div></div>`).join('');
  return `<div class="wrap onb"><div style="font-size:46px;margin-top:20px">🌿</div><h1 class="serif" style="font-size:30px;margin:6px 0" id="obhi">Hey ${OB.name?esc(OB.name):'there'}.</h1>
   <p class="muted" style="margin-top:0">This is your space to look after your headspace. Small things, most days. Gentle reminders, a quick mood check-in, and a treat when you have a full week. It's all private and stays on this phone.</p>
   <label class="f">What should I call you?</label><input class="inp" value="${esc(OB.name)}" placeholder="Your first name" autocomplete="given-name" oninput="OB.name=this.value.trim();document.getElementById('obhi').textContent='Hey '+(OB.name||'there')+'.'">
   <div class="sec">Pick a few small habits to start</div>${st}
   <div class="small muted">Start small. You can add more, or change anything, in the Plan tab.</div>
   <div class="sec">Where are you?</div>
   <div class="card">${countrySelect(OB.country||guessCountry(),"OB.country=this.value")}<div class="tiny muted" style="margin-top:8px">So the support lines in the app are the right ones for your country.</div></div>
   <div class="sec">Your first mantra (optional)</div>
   <div class="card"><input class="inp serif" style="font-size:17px" value="${esc(OB.mantra)}" placeholder="e.g. One step at a time." oninput="OB.mantra=this.value">
     <div class="tiny muted" style="margin-top:8px">Leave it blank and you'll get a few starter ones.</div></div>
   <button class="btn" style="margin:10px 0 30px;padding:16px" onclick="obFinish()">Let's begin →</button></div>`;
}
function obFinish(){
  const t=todayK();
  TEMPLATES.slice(0,4).forEach((tp,i)=>{if(!OB.picks[i])return;const x=JSON.parse(JSON.stringify(tp));x.id=uid();x.start=t;x.active=true;x.times=[OB.times[i]||tp.times[0]];S.data.tasks.push(x)});
  S.data.settings.name=OB.name||'';
  S.data.settings.country=OB.country||guessCountry();
  if(String(OB.mantra).trim())S.data.mantras.push({id:uid(),text:String(OB.mantra).trim()});
  S.data.onboarded=true;save();OB=null;S.tab='today';render();
  try{if(BR&&!BR.notificationsEnabled())BR.requestNotifications()}catch(e){}
}

/* ---------- open from notification ---------- */
window.openTabFromWidget=(tab,day)=>{if(!S.data.onboarded)return;closeSheet();S.dayOff=day&&/^\d{4}-\d\d-\d\d$/.test(day)?Math.max(-60,Math.min(60,Math.round((parseDk(day)-parseDk(todayK()))/864e5))):0;S.tab=tab;if(tab==='cal'){S.calMonth=null;S.calSel=todayK()}if(tab==='plan')S.proj=null;if(tab==='mind')S.mindView=null;window.scrollTo(0,0);render()};
window.openFromNotification=(tid,date,slot)=>{if(!S.data.onboarded)return;closeSheet();S.tab='today';S.dayOff=0;render();if(tid&&date&&slot)tapOcc(tid,date,slot)};
window.reloadData=()=>{
  let raw=null;try{raw=BR?BR.loadData():localStorage.getItem('th_data')}catch(e){}
  if(raw!=null&&raw===LAST_SAVED){if(!typingInPage())softRender();return}
  for(const k in PHC)delete PHC[k];load();
  // open sheets point at the old copies of tasks; swap in the fresh ones
  if(G&&G.o)G.o.task=task(G.o.task.id)||G.o.task;if(CF&&CF.o)CF.o.task=task(CF.o.task.id)||CF.o.task;
  softRender()};

/* ---------- boot ---------- */
load();render();
// keep "due now" labels fresh
setInterval(()=>{if(!S.sheetOpen&&!typingInPage())softRender()},60000);
let HID_AT=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){HID_AT=Date.now();return}if(HID_AT&&Date.now()-HID_AT>15*60e3)S.dayOff=0;if(!S.sheetOpen&&!typingInPage())softRender()});
</script>
</body>
</html>
