<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady</title>
<style>
:root{
  --bg:#F2F6F4; --card:#FFFFFF; --ink:#22302D; --muted:#6C7D78; --line:#E1EAE6;
  --sun:#9C8FD0; --sunSoft:#ECE9F7; --coral:#5E8C83; --coralSoft:#DDEBE7;
  --green:#4E9A78; --greenSoft:#DEF0E6; --red:#B97A86; --redSoft:#F3E3E6; --grey:#D3DDD9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{padding-bottom:88px;background:linear-gradient(180deg,#DCEBE6 0,#EAF2EF 180px,#F2F6F4 420px) no-repeat,#F2F6F4;min-height:100vh}
.top h1,.sheet h3,.serif{font-family:"Noto Serif",Georgia,serif;font-weight:600}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:26px;margin:0;font-weight:750;letter-spacing:-.3px}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(30,70,62,.08)}
.card{background:var(--card);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(30,70,62,.07)}
.card h2{font-size:17px;margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--coral);color:#fff;font-weight:650;width:100%}
.btn.sec2{background:var(--sunSoft);color:#4E4580}
.btn.ghost{background:#E4EDEA;color:var(--ink)}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650}
.p-done{background:var(--greenSoft);color:var(--green)}
.p-due{background:var(--coralSoft);color:var(--coral)}
.p-up{background:#E8EFEC;color:var(--muted)}
.p-miss{background:var(--redSoft);color:var(--red)}
/* week card */
.week{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.ring text{font-weight:750}
.wkmsg{font-weight:650;font-size:16px}
.track{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.trow{display:grid;grid-template-columns:1fr repeat(7,22px);gap:6px;align-items:center;margin:6px 0;font-size:14px}
.trow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:18px;height:18px;border-radius:50%;margin:auto}
.d-done{background:var(--green)}
.d-miss{background:var(--red);opacity:.85}
.d-due{border:2.5px solid var(--coral)}
.d-fut{background:var(--grey)}
.d-part{background:var(--sun)}
.dhead{font-size:11px;color:var(--muted);text-align:center;font-weight:650}
.dhead.today{color:var(--coral)}
/* task items */
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:0 1px 3px rgba(30,70,62,.07);width:100%;text-align:left}
.emo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--sunSoft)}
.item.done .emo{background:var(--greenSoft)}
.item.missed .emo{background:var(--redSoft)}
.item .grow{flex:1;min-width:0}
.item .t1{font-weight:650}
.item .t2{font-size:13px;color:var(--muted)}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:#eee}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--coralSoft);color:#2F5049;margin-bottom:12px;font-size:14px;width:100%;text-align:left}
.hmantra{font-family:"Noto Serif",Georgia,serif;font-style:italic;color:#4F6C66;font-size:14.5px;margin-top:6px;line-height:1.35}
.moodline{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px 8px 6px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(30,70,62,.07)}
.ml-main{flex:1;display:flex;gap:10px;align-items:center;text-align:left;padding:4px 0;min-width:0}.ml-main b{font-weight:650;font-size:15px}
.ml-note{flex:none;padding:8px 12px;border-radius:12px;background:#EEF5F2;font-size:13px;font-weight:700;color:var(--ink)}
.moodcard{padding:12px 14px}.mc-q{font-weight:700;font-size:15px}.moodcard .moods{margin-top:8px}
.foldbtn{display:block;width:100%;text-align:center;font-size:13px;font-weight:700;color:var(--coral);padding:10px 0 0;margin-top:8px;border-top:1px solid var(--line)}
.banner.sun{background:var(--sunSoft);color:#4E4580}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px 6px;font-weight:600;flex:1}
nav button.on{color:var(--coral)}
nav svg{width:24px;height:24px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(20,45,40,.32);z-index:10;display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--grey);margin:0 auto 12px}
.sheet.noanim{animation:none}
.sheet h3{margin:4px 0 14px;font-size:21px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 10px}
.fthumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#E4EDEA;padding:0;border:1px solid var(--line)}
.fthumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.fthumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#viewer{position:fixed;inset:0;background:#111;z-index:60;display:flex;flex-direction:column}
#viewer .vtop{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#1d2523}
#viewer .vtop button{color:#fff;font-size:22px;padding:6px 12px;font-weight:700}
#viewer .vimg{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center}
#viewer .vimg img{width:100%;display:block;margin:auto}
#viewer .vimg img.zoom{width:250%;max-width:none;margin:0}
#viewer .vbar{background:#1d2523;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
#viewer .vbar .inp{margin:0;flex:1;background:#2a3431;color:#fff;border-color:#3a4643}
#viewer .vbar .btn{width:auto;margin:0;flex:none}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.moodcard .moods button{font-size:24px;padding:6px 0}
.item.done .t1{color:#5D706B}.item.done{box-shadow:none;background:rgba(255,255,255,.65)}
.dayhead button{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:24px;line-height:1;color:var(--ink);font-weight:700}
.dh-mid{text-align:center}.dh-mid b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.dh-mid span{font-size:15px;font-weight:600}
.backtoday{display:block;margin:-2px auto 10px;padding:7px 14px;border-radius:999px;background:#E4EDEA;font-weight:700;font-size:14px;color:var(--ink)}
@keyframes slideL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.slide-l{animation:slideL .22s ease-out}.slide-r{animation:slideR .22s ease-out}
.pbar{height:6px;border-radius:9px;background:#E4EDEA;overflow:hidden;margin:7px 0 5px}.pbar i{display:block;height:100%;background:var(--coral);border-radius:9px}
.phead{display:block;width:100%;text-align:left;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}
.pstep{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pchk{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--line);background:#fff;color:#fff;font-weight:800;font-size:16px;margin-top:1px}
.pstep.on .pchk{background:var(--coral);border-color:var(--coral)}
.ptext{flex:1;text-align:left;padding:3px 0;min-width:0}.ptext span{display:block}.ptext small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pstep.on .ptext span{text-decoration:line-through;color:var(--muted)}
.pnote{display:block;width:100%;text-align:left;border-top:1px solid var(--line);padding:10px 0;margin-top:10px}.pnote small{display:block;font-size:12px;color:var(--muted)}.pnote span{display:block;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.docrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:#fff}
.docmain{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;min-width:0}
.docmain b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.docmain small{display:block;font-size:12px;color:var(--muted)}
.docico{font-size:24px;flex:none}.docmore{flex:none;padding:8px 14px;font-size:20px;font-weight:800;color:var(--muted)}
#docmenu{position:fixed;inset:0;z-index:70}#docmenu .dm-back{position:absolute;inset:0;background:rgba(20,30,28,.45)}
#docmenu .dm-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg,#F2F6F5);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.rorow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);transition:background .3s}
.rorow:last-child{border-bottom:0}.rorow .grow{flex:1;min-width:0}.rorow.moved .robtn{background:#fff}
.rorow.rohead .grow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rorow.moved{background:#E4EDEA;border-radius:10px;margin:0 -8px;padding:7px 8px}
.robtn{width:44px;height:40px;flex:none;border-radius:10px;background:#E4EDEA;font-size:15px;color:var(--ink)}.robtn:disabled{opacity:.3}
.frpick{padding:12px 14px;border-radius:14px;background:#EEF5F2;margin:10px 0 6px}.frpick.focus{background:#ECE9F7}
.frplan{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.frnum{width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.banner.frban{background:#ECE9F7;color:var(--ink)}
.frcmp{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.frcmp b{display:block;font-size:17px;margin:2px 0 4px}.frarrow{font-size:22px;color:var(--muted)}
.frdots6{display:flex;gap:4px}.frdots6 i{width:10px;height:10px;border-radius:50%;display:block}
.frscale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 2px 6px}
.frq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.frq-t{font-size:15px;line-height:1.35;margin-bottom:8px}
.frq-s{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.frq-s button{height:36px;border-radius:10px;background:#EEF5F2;font-weight:700;color:var(--ink);font-size:15px}
.frq-s button.on{background:var(--coral);color:#fff}
.frbig{text-align:center;margin:6px 0 8px}.frbig span{display:block}.frbig b{font-size:22px}
.frcmp2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}
.frcr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.frcr span{flex:1}.frcr b{font-variant-numeric:tabular-nums}.frcr i{width:16px;text-align:center;font-style:normal;font-size:12px;color:var(--muted)}
.frcr i.up{color:#4E9A78}.frcr i.down{color:#B97A86}
.frgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.frtile{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;padding:11px 12px;text-align:left;box-shadow:0 1px 3px rgba(30,70,62,.07);min-height:52px}
.frtile span{font-size:20px;flex:none}.frtile b{font-size:14px;font-weight:650;line-height:1.2}.frtool{background:#fff}
.frsig{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.frsig.on{border-color:var(--coral);background:#EEF5F2}.frsig.on .pchk{background:var(--coral);border-color:var(--coral)}.frsig .pchk{display:flex;align-items:center;justify-content:center}
.frlast{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:650}.frdots{margin-left:auto;display:flex;gap:4px}.frdots i{width:10px;height:10px;border-radius:50%;display:block}
.editpill{float:right;margin:2px 0 6px 10px;padding:7px 12px;border-radius:999px;background:#E4EDEA;color:var(--ink);font-size:14px;font-weight:700}
label.f{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none}
.inp:focus{border-color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff}
.emopick{display:flex;flex-wrap:wrap;gap:6px}
.emopick button{width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:21px}
.emopick button.on{border-color:var(--coral);background:var(--coralSoft)}
.timerow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.timerow .inp{flex:1}
.x{width:40px;height:40px;border-radius:12px;background:#E4EDEA;font-size:18px;flex:none}
.photo-big{width:100%;border-radius:16px;display:block;margin:6px 0 10px;max-height:55vh;object-fit:contain;background:#000}
.btns{display:grid;gap:10px;margin-top:18px}
.wo{display:grid;grid-template-columns:1fr 52px 52px 62px 36px;gap:6px;margin-bottom:6px}
.wo .inp{padding:10px 8px;font-size:15px}
.wo .x{width:36px;height:42px}
.whead{display:grid;grid-template-columns:1fr 52px 52px 62px 36px;gap:6px;font-size:11px;color:var(--muted);font-weight:650;padding:0 4px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding:4px 0}
.cell{aspect-ratio:1/1.08;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:600;position:relative}
.cell.out{opacity:.35}
.cell.sel{outline:2.5px solid var(--coral)}
.cell.today{background:var(--coralSoft)}
.cell .bar{width:60%;height:5px;border-radius:9px}
.cell .gf{position:absolute;top:2px;left:4px;font-size:10px}
.cell .ap{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:5px;border-radius:9px;display:inline-block}
/* hold */
.hold{position:relative;overflow:hidden;width:100%;padding:18px;border-radius:16px;background:var(--redSoft);color:var(--red);font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(185,122,134,.25)}
.hold span{position:relative}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:30;max-width:88vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.onb{min-height:100vh}
.starter{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#fff;border-radius:16px;margin-bottom:10px;border:2px solid transparent}
.starter.on{border-color:var(--coral)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--grey);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;margin-top:9px}
.starter.on .check{background:var(--coral);border-color:var(--coral)}
.tier{width:30px;height:30px;border-radius:10px;background:var(--sunSoft);color:#4E4580;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.mv{width:32px;height:30px;border-radius:9px;background:#E4EDEA;font-size:13px;flex:none}
.mv:disabled{opacity:.3}
.rbig{display:flex;gap:14px;align-items:center}
.breath{width:210px;height:210px;margin:18px auto 8px;position:relative;display:grid;place-items:center}
.breath .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#E8F2EF,#A9CCC3 60%,#7FAEA3);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 0 40px rgba(94,140,131,.35)}
.breath .lbl{position:relative;text-align:center;color:#1F3A35}
.breath .lbl b{display:block;font-size:22px;font-family:"Noto Serif",Georgia,serif;font-weight:600}
.mantra{font-family:"Noto Serif",Georgia,serif;font-size:22px;line-height:1.4;text-align:center;padding:18px 10px;color:#2F5049}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:28px;padding:8px 0;border-radius:14px;background:var(--bg);border:2px solid transparent}
.moods button.on{border-color:var(--coral);background:var(--coralSoft)}
.help a{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.help a:last-child{border-bottom:0}
.help a b{color:var(--coral)}
.recbtn{width:88px;height:88px;border-radius:50%;background:var(--coral);color:#fff;font-size:34px;display:inline-grid;place-items:center;box-shadow:0 6px 18px rgba(94,140,131,.35)}
.recbtn.on{background:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,122,134,.5)}50%{box-shadow:0 0 0 16px rgba(185,122,134,0)}}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--grey);position:relative;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:23px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tool{border-radius:20px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(30,70,62,.07)}
.tool .big{font-size:28px}
.tool b{display:block;margin-top:6px;font-size:15px}

<nav id="nav"></nav>

<script>
'use strict';
const BR = window.Android || null;
const S = {data:null, tab:'today', calMonth:null, calSel:null, sheetOpen:false, onClose:null};

/* ---------- helpers ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDk=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const todayK=()=>dk(new Date());
const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return (h%12||12)+(m?':'+pad(m):'')+(h<12?'am':'pm')}
function fmtDate(k,withDow=true){const d=parseDk(k);return (withDow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()].slice(0,3)}
function relDay(k){const t=todayK();if(k===t)return 'Today';if(k===dk(addDays(new Date(),1)))return 'Tomorrow';if(k===dk(addDays(new Date(),-1)))return 'Yesterday';return fmtDate(k)}
function daysSummary(days){const s=[...days].sort((a,b)=>((a+6)%7)-((b+6)%7));if(s.length===7)return 'Every day';if(s.length===5&&[1,2,3,4,5].every(x=>s.includes(x)))return 'Weekdays';if(s.length===2&&s.includes(0)&&s.includes(6))return 'Weekends';return s.map(d=>DOW[d]).join(', ')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function slotMin(s){const [h,m]=s.split(':').map(Number);return h*60+m}

/* ---------- data ---------- */
function defaultData(){return {version:1,onboarded:false,
  settings:{name:'',nagMinutes:30,nagMax:4,photoProof:false,photoOffFrom:null,vitdTarget:'',lastBackup:null,giver:''},
  tasks:[],completions:[],records:[],appointments:[],rewards:[],rewardsEarned:[],rewardsFrom:null,rewardPlan:{},moods:[],mantras:[],journal:[],wt:[],tough:{},walks:{},projects:[],fresh:{checks:[],entries:[],good:[],wants:[]}}}
function load(){
  let raw=null;
  try{raw=BR?BR.loadData():localStorage.getItem('th_data')}catch(e){}
  let d=null;try{d=raw?JSON.parse(raw):null}catch(e){}
  const def=defaultData();
  S.data=Object.assign(def,d||{});
  S.data.settings=Object.assign(defaultData().settings,(d&&d.settings)||{});
  if(!S.data.rewardPlan)S.data.rewardPlan={};
  if(!S.data.wt)S.data.wt=[];
  if(!S.data.projects)S.data.projects=[];
  frData();
  if(!S.data.tough)S.data.tough={};
  if(!S.data.walks)S.data.walks={};
  // keep a copy of step history in the data file so it's included in backups
  try{if(BR&&BR.stepsStatus){const i=JSON.parse(BR.stepsStatus());if(i.hist){S.data.stepsHist=S.data.stepsHist||{};let ch=false;for(const k in i.hist){if((S.data.stepsHist[k]||0)<i.hist[k]){S.data.stepsHist[k]=i.hist[k];ch=true}}if(ch)BR.saveData(JSON.stringify(S.data))}}}catch(e){}
  for(const t of S.data.tasks){if(!t.repeat)t.repeat=t.days&&t.days.length===7?'daily':'weekly';if(!t.days)t.days=[];if(!t.start)t.start=todayK()}
  if(!S.data.settings.odFrom){S.data.settings.odFrom=dk(addDays(new Date(),-1));if(S.data.onboarded)save()}
  try{LAST_SAVED=BR?BR.loadData():localStorage.getItem('th_data')||''}catch(e){}
}
/* re-draw without losing anything typed into the page (used for timers and coming back to the app) */
function softRender(){
  const app=document.getElementById('app'),keep={};let foc=null,ss=null,se=null;
  if(app)app.querySelectorAll('input[id],textarea[id]').forEach(e=>{if(e.value)keep[e.id]=e.value});
  const a=document.activeElement;if(a&&a.id&&app&&app.contains(a)){foc=a.id;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  render();
  for(const id in keep){const e=document.getElementById(id);if(e&&!e.value)e.value=keep[id]}
  if(foc){const e=document.getElementById(foc);if(e){e.focus();try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
}
function typingInPage(){const a=document.activeElement,app=document.getElementById('app');return !!(a&&app&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
let LAST_SAVED='';
function save(){
  try{syncProjects()}catch(e){}
  const j=JSON.stringify(S.data);
  try{ if(BR){BR.saveData(j);BR.reschedule()} else localStorage.setItem('th_data',j);LAST_SAVED=j }
  catch(e){toast('Could not save: '+e)}
}
function task(id){return S.data.tasks.find(t=>t.id===id)}

/* photo proof: on, or switched off but not yet in effect */
function photoRequired(dateK){const s=S.data.settings;return s.photoProof||(s.photoOffFrom&&dateK<s.photoOffFrom)}
function photoPending(){const s=S.data.settings;return !s.photoProof&&s.photoOffFrom&&todayK()<s.photoOffFrom}

/* ---------- schedule maths ---------- */
function diffDays(a,b){const x=parseDk(a),y=parseDk(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5)}
/* When a repeating task's time, days or on/off changes, the old schedule is kept in t.past for the days
   before the change, so past ticks, the week grid, streaks and rewards don't get rewritten. */
function schedAt(t,k){
  if(t.end&&k>=t.end)return null;
  for(const v of t.past||[])if(k<v.to)return v.off?null:v;
  return t.active?t:null;
}
function schedOf(t){return {repeat:t.repeat,days:[...(t.days||[])].sort(),every:t.every,start:t.start,until:t.until||'',times:[...(t.times||[])].sort()}}
function cutDay(t){const tk=todayK();return S.data.completions.some(c=>c.taskId===t.id&&c.date===tk)?dk(addDays(new Date(),1)):tk}
function keepHistory(old,t,deleting){
  const cut=cutDay(old);t.past=(old.past||[]).map(v=>Object.assign({},v));
  const nowOn=!deleting&&t.active,changed=JSON.stringify(schedOf(old))!==JSON.stringify(schedOf(t));
  const last=t.past[t.past.length-1],add=v=>{if(!last||last.to<v.to)t.past.push(v)};  // an earlier version already covers those days
  if(old.active&&old.repeat!=='none'&&old.start<cut&&(changed||!nowOn))add(Object.assign(schedOf(old),{to:cut}));
  else if(!old.active&&nowOn)add({off:true,to:cut});
  if(!t.past.length)delete t.past;
  return cut;
}
function occurs(t,k){const s=schedAt(t,k);return !!s&&occursS(s,k)}
function occursS(t,k){
  const st=t.start||k;
  if(k<st)return false;
  if(t.end&&k>=t.end)return false;
  if(t.until&&k>t.until)return false;
  const d=parseDk(k),w=d.getDay(),r=t.repeat||'weekly';
  if(r==='none')return k===st;
  if(r==='daily')return true;
  if(r==='weekly')return t.days.includes(w);
  if(r==='fortnightly'){if(!t.days.includes(w))return false;return Math.floor(diffDays(dk(weekStart(parseDk(st))),dk(weekStart(d)))/7)%2===0}
  if(r==='monthly'){const sd=parseDk(st).getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(sd,last)}
  if(r==='everyN'){const n=Math.max(1,parseInt(t.every)||2);return diffDays(st,k)%n===0}
  return false;
}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function scheduleSummary(t){
  const r=t.repeat||'weekly';let s;
  if(r==='none')s='One-off · '+relDay(t.start);
  else if(r==='daily')s='Every day';
  else if(r==='weekly')s=daysSummary(t.days);
  else if(r==='fortnightly')s='Fortnightly · '+daysSummary(t.days);
  else if(r==='monthly')s='Monthly on the '+ordinal(parseDk(t.start).getDate());
  else s='Every '+(parseInt(t.every)||2)+' days';
  if(r!=='none'&&t.start>todayK())s+=' · from '+fmtDate(t.start,false);
  if(r!=='none'&&t.until)s+=' · until '+fmtDate(t.until,false);
  return s;
}
function oneDone(t){return S.data.completions.some(c=>c.taskId===t.id)}
function isFinished(t){const tk=todayK();return (t.repeat==='none'&&t.start<tk&&(oneDone(t)||t.start<(S.data.settings.odFrom||'')))||(t.until&&t.until<tk)}
/* one-off to-dos that weren't done stay on Today until they are (anything missed before this was added is left alone) */
function isOverdue(t){return t.repeat==='none'&&t.active&&!t.end&&t.start<todayK()&&t.start>=(S.data.settings.odFrom||'9')&&!oneDone(t)}
function findComp(tid,date,slot){return S.data.completions.find(c=>c.taskId===tid&&c.date===date&&c.slot===slot)}
function occFor(k){
  const w=parseDk(k).getDay(),out=[];
  for(const t of S.data.tasks){
    const sc=schedAt(t,k);
    if(!sc||!occursS(sc,k))continue;
    for(const slot of sc.times)out.push({task:t,slot,date:k,comp:findComp(t.id,k,slot)});
  }
  out.sort((a,b)=>a.slot.localeCompare(b.slot));
  return out;
}
function status(o){
  if(o.comp)return 'done';
  const t=todayK();
  if(o.date<t)return 'missed';
  if(o.date>t)return 'future';
  return nowMin()>=slotMin(o.slot)?'due':'upcoming';
}
function canComplete(o){const y=dk(addDays(new Date(),-1));return !o.comp&&((o.date>=y&&o.date<=todayK())||o.task.repeat==='none')}
function weekStats(){
  const ws=weekStart(new Date()),days=[];let total=0,done=0,dueSoFar=0;
  for(let i=0;i<7;i++){
    const k=dk(addDays(ws,i)),oc=occFor(k);
    days.push({k,oc});total+=oc.length;done+=oc.filter(o=>o.comp).length;
    dueSoFar+=oc.filter(o=>{const s=status(o);return s==='done'||s==='missed'||s==='due'}).length;
  }
  return {ws,days,total,done,dueSoFar};
}
function earliestStart(){let e=null;for(const t of S.data.tasks)for(const v of [t,...(t.past||[])]){if(v.start&&(!e||v.start<e))e=v.start}return e}
function streak(){
  let n=0;const tOcc=occFor(todayK());
  if(tOcc.length&&tOcc.every(o=>o.comp))n++;
  const e=earliestStart();if(!e)return n;
  let d=addDays(new Date(),-1);
  for(let i=0;i<1000;i++){
    const k=dk(d);if(k<e)break;
    const oc=occFor(k);
    if(oc.length){if(oc.every(o=>o.comp))n++;else break}
    d=addDays(d,-1);
  }
  return n;
}

/* ---------- photos ---------- */
const photoCbs={};
function takePhoto(cb){
  const req=uid();photoCbs[req]=cb;
  if(BR){BR.takePhoto(req);return}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,1000/Math.max(img.width,img.height));
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const id='p'+uid();try{localStorage.setItem('th_photo_'+id,c.toDataURL('image/jpeg',.7))}catch(e){toast('Phone storage is full');return}
      window.onPhotoTaken(req,id)};
    img.src=URL.createObjectURL(f)};
  inp.click();
}
window.onPhotoTaken=(req,id)=>{const cb=photoCbs[req];delete photoCbs[req];if(id&&cb)cb(id);else if(!id)toast('No photo taken')};
const PHC={};
function photoSrc(id){if(!id)return '';if(PHC[id])return PHC[id];let v='';try{v=BR?(BR.loadPhoto(id)||''):(localStorage.getItem('th_photo_'+id)||'')}catch(e){}if(v)PHC[id]=v;return v}
function deletePhoto(id){if(!id)return;delete PHC[id];try{BR?BR.deletePhoto(id):localStorage.removeItem('th_photo_'+id)}catch(e){}}

/* ---------- task info: screenshots & photos kept on a task (shared by every day it repeats) ---------- */
function filesBox(t){
  const fs=t.files||[],ds=t.docs||[];
  const btns=`<div class="row" style="gap:6px"><button class="btn ghost sm" style="flex:1;margin:0;padding-left:6px;padding-right:6px" onclick="addFiles('${t.id}')">🖼️ Gallery</button><button class="btn ghost sm" style="flex:1;margin:0;padding-left:6px;padding-right:6px" onclick="addFilePhoto('${t.id}')">📷 Photo</button><button class="btn ghost sm" style="flex:1;margin:0;padding-left:6px;padding-right:6px" onclick="addDocs('${t.id}')">📄 File</button></div>`;
  const n=fs.length+ds.length;
  if(!n)return `<label class="f">📎 Info, screenshots & files</label><div class="card" style="padding:10px 12px"><div class="tiny muted" style="padding:0 0 8px">Keep screenshots, receipts, PDFs or details you might need later.</div>${btns}</div>`;
  return `<label class="f">📎 Info, screenshots & files · ${n}</label><div class="card" style="padding:10px 12px">${fs.length?`<div class="fgrid">${fs.map(f=>`<button class="fthumb" onclick="viewFile('${t.id}','${f.id}')"><img src="${photoSrc(f.photoId)}" alt="">${f.cap?`<span>${esc(f.cap)}</span>`:''}</button>`).join('')}</div>`:''}
   ${ds.map(d=>`<div class="docrow"><button class="docmain" onclick="openDoc('${t.id}','${d.id}')"><span class="docico">${docIcon(d)}</span><span class="grow" style="min-width:0"><b>${esc(d.name)}</b><small>${fmtSize(d.size)}${d.at?' · added '+fmtDate(d.at.slice(0,10)):''}</small></span></button><button class="docmore" onclick="docMenu('${t.id}','${d.id}')" aria-label="More">⋯</button></div>`).join('')}
   ${btns}</div>`;
}
function docIcon(d){const e=(d.name.split('.').pop()||'').toLowerCase();return e==='pdf'?'📕':['doc','docx','odt','rtf','pages'].includes(e)?'📘':['xls','xlsx','csv','ods','numbers'].includes(e)?'📗':['ppt','pptx','key'].includes(e)?'📙':['jpg','jpeg','png','heic','webp','gif'].includes(e)?'🖼️':['zip','rar','7z'].includes(e)?'🗜️':['mp3','m4a','wav'].includes(e)?'🎧':['mp4','mov'].includes(e)?'🎬':'📄'}
function fmtSize(b){if(!(b>=0))return '';return b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(b<10485760?1:0)+' MB'}
function addDocs(oid){
  if(BR&&BR.pickDocs){BR.pickDocs('doc|'+oid+'|'+uid());return}
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;
  inp.onchange=()=>{const list=[...inp.files].slice(0,10).map((f,n)=>({file:'d'+Date.now()+'_'+n+'.'+((f.name.split('.').pop()||'bin').toLowerCase()),name:f.name,size:f.size,mime:f.type||'application/octet-stream'}));if(list.length){toast('Files only open properly in the phone app');attachDocs(oid,list)}};
  inp.click();
}
window.onDocsPicked=(req,json)=>{const p=String(req).split('|');let list=[];try{list=JSON.parse(json)}catch(e){}if(p[0]!=='doc'||!list.length)return;attachDocs(p[1],list)};
function attachDocs(oid,list){
  const o=owner(oid);if(!o){list.forEach(d=>{try{BR&&BR.deleteDoc(d.file)}catch(e){}});return}
  o.docs=o.docs||[];const at=nowStamp();
  list.forEach(d=>o.docs.push({id:uid(),file:d.file,name:d.name||'File',size:d.size,mime:d.mime||'application/octet-stream',at}));
  save();sheetRefresh(oid);toast(list.length>1?list.length+' files added 📎':'File added 📎');
}
function findDoc(oid,did){const o=owner(oid);return o&&o.docs?o.docs.find(d=>d.id===did):null}
function openDoc(oid,did,share){
  const d=findDoc(oid,did);if(!d)return;
  if(BR&&BR.openDoc){BR.openDoc(d.file,d.mime||'',d.name,!!share);return}
  toast('Files open in the phone app');
}
let DM=null;
function docMenu(oid,did){
  const d=findDoc(oid,did);if(!d)return;DM={oid,did};
  let v=document.getElementById('docmenu');if(!v){v=document.createElement('div');v.id='docmenu';document.body.appendChild(v)}
  v.innerHTML=`<div class="dm-back" onclick="closeDocMenu()"></div><div class="dm-panel"><div class="row" style="gap:10px;margin-bottom:10px"><span style="font-size:28px">${docIcon(d)}</span><div class="grow" style="min-width:0"><b style="word-break:break-word">${esc(d.name)}</b><div class="tiny muted">${fmtSize(d.size)}</div></div></div>
   <label class="f" style="margin-top:4px">Name</label><input class="inp" value="${esc(d.name)}" onchange="renameDoc(this.value)">
   <div class="btns"><button class="btn" onclick="closeDocMenu();openDoc('${oid}','${did}')">Open it</button><button class="btn ghost" onclick="closeDocMenu();openDoc('${oid}','${did}',true)">Send it / save a copy</button><button class="btn danger" onclick="delDoc()">Delete file</button><button class="btn ghost" onclick="closeDocMenu()">Close</button></div></div>`;
}
function closeDocMenu(){DM=null;const v=document.getElementById('docmenu');if(v)v.remove()}
function renameDoc(v){const d=findDoc(DM.oid,DM.did);v=(v||'').trim();if(!d||!v)return;const ext=(d.name.match(/\.[A-Za-z0-9]{1,8}$/)||[''])[0];if(ext&&!/\.[A-Za-z0-9]{1,8}$/.test(v))v+=ext;d.name=v;save();sheetRefresh(DM.oid);docMenu(DM.oid,DM.did)}
function delDoc(){
  const o=owner(DM.oid),d=findDoc(DM.oid,DM.did);if(!d)return;
  if(!confirmTap('dd'+d.id,'Tap Delete again to remove it'))return;
  try{BR&&BR.deleteDoc(d.file)}catch(e){}
  o.docs=o.docs.filter(x=>x.id!==d.id);const oid=DM.oid;closeDocMenu();save();sheetRefresh(oid);toast('File deleted');
}
function dropDocs(o){(o.docs||[]).forEach(d=>{try{BR&&BR.deleteDoc(d.file)}catch(e){}})}
function sheetRefresh(tid){
  try{render()}catch(e){}
  if(!S.sheetOpen)return;
  if(STEP_REFRESH)STEP_REFRESH();
  else if(G&&G.o.task.id===tid){if(GT){const el=document.getElementById('gdsteps');if(el)el.innerHTML=gdSteps()}else renderGD()}
  else if(CF&&CF.o&&CF.o.task.id===tid)renderComplete();
}
function attachFiles(tid,ids){
  const t=owner(tid);if(!t){ids.forEach(deletePhoto);return}
  t.files=t.files||[];const at=dk(new Date())+'T'+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  ids.forEach(id=>t.files.push({id:uid(),photoId:id,cap:'',at}));
  save();sheetRefresh(tid);toast(ids.length>1?ids.length+' images added 📎':'Image added 📎');
}
function addFiles(tid){
  if(BR&&BR.pickImages){BR.pickImages('att|'+tid+'|'+uid());return}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async()=>{const ids=[];for(const f of [...inp.files].slice(0,10)){const id=await new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,1600/Math.max(img.width,img.height));c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);const id='f'+uid();try{localStorage.setItem('th_photo_'+id,c.toDataURL('image/jpeg',.85));res(id)}catch(e){toast('Phone storage is full');res('')}};img.onerror=()=>res('');img.src=URL.createObjectURL(f)});if(id)ids.push(id)}if(ids.length)attachFiles(tid,ids)};
  inp.click();
}
window.onImagesPicked=(req,json)=>{const p=String(req).split('|');let ids=[];try{ids=JSON.parse(json)}catch(e){}if(p[0]!=='att'||!ids.length)return;attachFiles(p[1],ids)};
function addFilePhoto(tid){takePhoto(id=>attachFiles(tid,[id]))}
let VW=null;
function viewFile(tid,fid){
  const t=owner(tid);if(!t||!t.files)return;const i=t.files.findIndex(f=>f.id===fid);if(i<0)return;
  VW={tid,i,zoom:false};paintViewer();
}
function paintViewer(){
  const t=owner(VW.tid),fs=(t&&t.files)||[];if(!fs.length)return closeViewer();
  VW.i=Math.max(0,Math.min(VW.i,fs.length-1));const f=fs[VW.i];
  let v=document.getElementById('viewer');if(!v){v=document.createElement('div');v.id='viewer';document.body.appendChild(v)}
  v.innerHTML=`<div class="vtop"><button onclick="closeViewer()">✕</button><span class="small">${VW.i+1} of ${fs.length}${f.at?' · added '+fmtDate(f.at.slice(0,10)):''}</span><span><button ${VW.i?'':'style="opacity:.3"'} onclick="VW.i--;VW.zoom=false;paintViewer()">‹</button><button ${VW.i<fs.length-1?'':'style="opacity:.3"'} onclick="VW.i++;VW.zoom=false;paintViewer()">›</button></span></div>
   <div class="vimg"><img class="${VW.zoom?'zoom':''}" src="${photoSrc(f.photoId)}" onclick="VW.zoom=!VW.zoom;this.classList.toggle('zoom',VW.zoom)"></div>
   <div class="tiny" style="color:#9aa8a4;text-align:center;background:#1d2523;padding-top:6px">Tap the picture to zoom in, then drag to move around</div>
   <div class="vbar"><input class="inp" value="${esc(f.cap||'')}" placeholder="Add a label (e.g. ABN application ref)" onchange="vwCap(this.value)"><button class="btn danger sm" onclick="vwDel()">Delete</button></div>`;
}
function vwCap(v){const t=owner(VW.tid);const f=t.files[VW.i];f.cap=v.trim();save();sheetRefresh(VW.tid)}
function vwDel(){
  const t=owner(VW.tid),f=t.files[VW.i];
  if(!confirmTap('vf'+f.id,'Tap Delete again to remove it'))return;
  deletePhoto(f.photoId);t.files.splice(VW.i,1);save();sheetRefresh(VW.tid);
  if(!t.files.length)closeViewer();else paintViewer();
}
function closeViewer(){VW=null;const v=document.getElementById('viewer');if(v)v.remove()}

function openSheet(html,onClose,keep){
  const ov=document.getElementById('ov');
  const old=ov.querySelector('.sheet'),top=keep&&old?old.scrollTop:0;
  ov.innerHTML='<div class="sheet'+(keep&&old?' noanim':'')+'" onclick="event.stopPropagation()"><div class="grab"></div>'+html+'</div>';
  if(top)ov.querySelector('.sheet').scrollTop=top;
  ov.classList.add('show');document.body.classList.add('noscroll');S.sheetOpen=true;S.onClose=onClose||null;
}
function closeSheet(){
  try{STEP_REFRESH=null}catch(e){}
  if(typeof breathStop==='function')breathStop();
  const ov=document.getElementById('ov');ov.classList.remove('show');ov.innerHTML='';
  document.body.classList.remove('noscroll');S.sheetOpen=false;
  const f=S.onClose;S.onClose=null;if(f)f();
}
document.getElementById('ov').addEventListener('click',closeSheet);

/* ---------- Today ---------- */
function ringSvg(pct,size=96){
  const r=size/2-9,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E3ECE8" stroke-width="10"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pct>=100?'#4E9A78':'#5E8C83'}" stroke-width="10" stroke-linecap="round"
     stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.4}" fill="#22302D">${pct}%</text></svg>`;
}
function dayCell(oc){
  if(!oc.length)return '<div></div>';
  const st=oc.map(status);
  if(st.every(s=>s==='done'))return '<div class="dot d-done"></div>';
  if(st.some(s=>s==='missed')&&st.some(s=>s==='done'))return '<div class="dot d-part"></div>';
  if(st.every(s=>s==='missed'))return '<div class="dot d-miss"></div>';
  if(st.some(s=>s==='due'||s==='upcoming'))return st.some(s=>s==='done')?'<div class="dot d-part"></div>':'<div class="dot d-due"></div>';
  return '<div class="dot d-fut"></div>';
}
function weekCard(){
  const w=weekStats();
  const pct=w.total?Math.round(w.done/w.total*100):0;
  const st=streak();
  let msg,sub;
  if(!w.total){msg='Nothing planned this week';sub='Add tasks in the Plan tab.'}
  else if(w.done>=w.total){msg='Full week. Well done 🌿';sub=`All ${w.total} done. Take a moment to notice that.`}
  else if(w.done>=w.dueSoFar){msg='Steady and on track';sub=`${w.done} of ${w.total} done · ${w.total-w.done} to go this week`}
  else{const b=w.dueSoFar-w.done;msg=`${b} to catch up`;sub=`${w.done} of ${w.total} done. No stress, one small thing at a time.`}
  const tk=todayK();
  const heads=w.days.map(d=>`<div class="dhead ${d.k===tk?'today':''}">${DOW[parseDk(d.k).getDay()][0]}</div>`).join('');
  const ids=[];w.days.forEach(d=>d.oc.forEach(o=>{if(!ids.includes(o.task.id))ids.push(o.task.id)}));
  const rows=ids.map(id=>{const t=task(id);return `<div class="trow"><div class="nm">${esc(t.emoji)} ${esc(t.name)}</div>${w.days.map(d=>dayCell(d.oc.filter(o=>o.task.id===id))).join('')}</div>`}).join('');
  return `<div class="card"><div class="week">${ringSvg(pct)}<div><div class="small muted">This week</div><div class="wkmsg">${msg}</div><div class="small muted" style="margin-top:3px">${sub}</div>
    ${st>0?`<div class="small" style="margin-top:6px;font-weight:650">🔥 ${st}-day streak</div>`:''}
    ${(()=>{const nx=rewardFor(dk(w.ws)),got=S.data.rewardsEarned.find(e=>e.week===dk(w.ws));return got?`<div class="small" style="margin-top:6px">🎁 Earned: <b>${esc(got.name)}</b></div>`:nx&&dk(w.ws)>=S.data.rewardsFrom?`<button class="small" style="margin-top:6px;text-align:left;padding:0" onclick="go('rewards')">🎁 Hit 100% to unlock: <b>${esc(nx.name)}</b></button>`:''})()}</div></div>
    ${rows?(S.data.settings.weekGrid!==false?`<div class="track"><div class="trow"><div></div>${heads}</div>${rows}</div><button class="foldbtn" onclick="S.data.settings.weekGrid=false;save();render()">Hide each task ▴</button>`:`<button class="foldbtn" onclick="S.data.settings.weekGrid=true;save();render()">See each task this week ▾</button>`):''}</div>`;
}
function occItem(o,showDate){
  const s=status(o),t=o.task;
  const lbl={done:'<span class="pill p-done">Done ✓</span>',due:'<span class="pill p-due">Due now</span>',upcoming:'<span class="pill p-up">'+fmtTime(o.slot)+'</span>',missed:'<span class="pill p-miss">'+(t.repeat==='none'?'Not done yet':'Missed')+'</span>',future:'<span class="pill p-up">'+fmtTime(o.slot)+'</span>'}[s];
  const cls=s==='done'?'done':s==='missed'?'missed':'';
  const th=o.comp&&o.comp.photoId?photoSrc(o.comp.photoId):'';
  const tr=t.tough&&!o.comp?S.data.tough[t.id+'|'+o.date+'|'+o.slot]:null;
  const wk=!o.comp?walkFor(o):null;
  if(wk){
    const g=t.stepMode==='goal'?t.stepGoal:0;
    return `<button class="item" onclick="tapOcc('${t.id}','${o.date}','${o.slot}')"><div class="emo">${esc(t.emoji)}</div>
    <div class="grow"><div class="t1">${esc(t.name)}</div><div class="t2">🚶 Walking · <b data-walk="${esc(walkKey(o))}">${fmtN(walkSteps(wk))}</b> steps${g?' of '+fmtN(g):''}</div></div><span class="pill p-due">On the go</span></button>`;
  }
  const sub=s==='done'?'Done at '+fmtTime(o.comp.at.slice(11,16))+(o.comp.late?' (late)':'')+(o.comp.walk?' · 👣 '+fmtN(o.comp.walk.steps)+' steps':'')+(o.comp.tough?(o.comp.tough.partial?' · 🌿 did my bit':' · 💪 did the hard thing'):''):(t.tough?'😬 '+(tr&&tr.mins?'Started · '+tr.mins+' min in · ':'Tough one · '):'')+(t.tough&&t.steps&&t.steps.length?(nextStepOf(t)?'Next: '+esc(nextStepOf(t))+' · ':'All steps done 🎉 · '):'')+(showDate?relDay(o.date)+' · ':'')+((s==='upcoming'||s==='future')&&!showDate?'':fmtTime(o.slot))+(t.notes?' · '+esc(t.notes):'');
  const sub2=sub.replace(/^( · )+|( · )+$/g,'').replace(/( · ){2,}/g,' · ');
  return `<button class="item ${cls}" onclick="tapOcc('${t.id}','${o.date}','${o.slot}')">
    ${th?`<img class="thumb" src="${th}">`:`<div class="emo">${esc(t.emoji)}</div>`}
    <div class="grow"><div class="t1">${esc(t.name)}</div>${sub2?`<div class="t2">${sub2}</div>`:''}</div>${lbl}</button>`;
}
function viewToday(){
  const s=S.data.settings,h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const now=new Date();
  let html=`<div class="wrap"><div class="top"><div><h1>${greet}${s.name?', '+esc(s.name):''}</h1><div class="sub">${DOWL[now.getDay()]} ${now.getDate()} ${MON[now.getMonth()]}</div><div class="hmantra">“${esc(todayMantra())}”</div></div>
    <button class="iconbtn" onclick="openSettings()" aria-label="Settings">${GEAR}</button></div>`;
  html+=frBanner();
  try{ if(BR&&!BR.notificationsEnabled())html+=`<button class="banner" onclick="Android.requestNotifications()">🔔 <span><b>Reminders are switched off.</b> Tap to allow notifications so the app can nudge you.</span></button>`;
       else if(BR&&!BR.exactAlarmsAllowed())html+=`<button class="banner sun" onclick="Android.openExactAlarmSettings()">⏰ <span><b>Reminders may run late.</b> Tap and allow "Alarms &amp; reminders" for this app.</span></button>`; }catch(e){}
  if(photoPending())html+=`<button class="banner sun" onclick="openSettings()">📷 <span>Photo proof switches off tomorrow. Tap to keep it on.</span></button>`;
  const lb=s.lastBackup;
  if(S.data.completions.length>10&&(!lb||(Date.now()-parseDk(lb).getTime())>30*864e5))html+=`<button class="banner sun" onclick="openSettings()">💾 <span>${lb?'It\'s been a month since your last backup.':'You haven\'t made a backup yet.'} Tap to save one.</span></button>`;
  const pend=S.data.rewardsEarned.filter(e=>!e.givenAt);
  if(pend.length)html+=`<button class="banner sun" onclick="go('rewards')">🎁 <span><b>You've earned ${pend.length===1?esc(pend[0].name):pend.length+' rewards'}!</b> Go treat yourself.</span></button>`;
  html+=moodCard()+weekCard();
  // yesterday's missed ones can still be done
  const off=S.dayOff||0,dK=dk(addDays(now,off)),dd=parseDk(dK);
  const y=dk(addDays(now,-1));
  const yMiss=off===0?occFor(y).filter(o=>!o.comp):[];
  const tOcc=occFor(dK);
  const lab=off===0?'Today':off===1?'Tomorrow':off===-1?'Yesterday':DOWL[dd.getDay()];
  html+=`<div class="dayhead" id="dayhead"><button onclick="shiftDay(-1)" aria-label="Previous day">‹</button><div class="dh-mid"><b>${lab}</b><span>${DOWL[dd.getDay()].slice(0,3)} ${dd.getDate()} ${MON[dd.getMonth()]}${off&&Math.abs(off)>1?' · '+(off>0?'in '+off+' days':Math.abs(off)+' days ago'):''}</span></div><button onclick="shiftDay(1)" aria-label="Next day">›</button></div>
   ${off?`<button class="backtoday" onclick="shiftDay(0)">↩ Back to today</button>`:''}
   <div id="daylist" class="${S.slideDir>0?'slide-l':S.slideDir<0?'slide-r':''}">`;
  if(!tOcc.length)html+=`<div class="card empty">${off===0?'Nothing scheduled today. Rest is part of it too 🌿':off>0?'Nothing planned for '+(off===1?'tomorrow':'this day')+'. Enjoy the breather 🌿':'Nothing was planned this day.'}</div>`;
  const pending=tOcc.filter(o=>!o.comp),doneL=tOcc.filter(o=>o.comp);
  html+=pending.map(o=>occItem(o)).join('')+doneL.map(o=>occItem(o)).join('');
  if(off<0&&tOcc.length)html+=`<div class="tiny muted" style="text-align:center;margin:4px 0 10px">${doneL.length} of ${tOcc.length} done that day</div>`;
  html+=`</div>`;
  if(off===0&&!s.swiped)html+=`<div class="tiny muted" style="text-align:center;margin:2px 0 6px">Swipe left or right to see other days</div>`;
  if(off===0){const od=[];S.data.tasks.filter(t=>isOverdue(t)&&t.start<y).sort((a,b)=>a.start.localeCompare(b.start)).forEach(t=>t.times.forEach(sl=>{if(!findComp(t.id,t.start,sl))od.push({task:t,slot:sl,date:t.start,comp:null})}));
    if(od.length)html+=`<div class="sec">Still to do</div>`+od.map(o=>occItem(o,true)).join('')}
  if(yMiss.length){html+=`<div class="sec">From yesterday · still time if you want</div>`+yMiss.map(o=>occItem(o,true)).join('')}
  if(off===0)html+=`<div style="height:8px"></div>`+stepsTodayCard()+frTodayCard()+todayProjects();
  const ap=upcomingAppts().filter(a=>a.date<=dk(addDays(now,30)));
  if(ap.length){html+=`<div class="sec">Coming up</div>`+ap.slice(0,3).map(apptItem).join('')}
  return html+'</div>';
}
function shiftDay(n){
  const before=S.dayOff||0;if(!S.data.settings.swiped){S.data.settings.swiped=true;save()}
  S.dayOff=n===0?0:Math.max(-60,Math.min(60,before+n));
  if(S.dayOff===before)return;
  S.slideDir=n===0?(before>0?-1:1):n;render();S.slideDir=0;
  const h=document.getElementById('dayhead');if(h){const r=h.getBoundingClientRect();if(r.top<0||r.top>innerHeight*0.6)window.scrollTo({top:scrollY+r.top-12,behavior:'smooth'})}
}
(function(){let x0=null,y0=0,t0=0;
  document.addEventListener('touchstart',e=>{const t=e.target;if(S.tab!=='today'||S.sheetOpen||e.touches.length>1||(t.closest&&t.closest('input,textarea,select,#viewer'))){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});
  document.addEventListener('touchend',e=>{if(x0===null)return;const c=e.changedTouches[0],dx=c.clientX-x0,dy=c.clientY-y0;x0=null;
    if(Date.now()-t0>800||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;shiftDay(dx<0?1:-1)},{passive:true});
})();
function editPill(id){return `<button class="editpill" onclick="closeSheet();editTask('${id}')">✏️ Edit</button>`}
function tapOcc(tid,date,slot,keep){
  const t=task(tid);if(!t)return;
  STEP_REFRESH=null;
  const o={task:t,date,slot,comp:findComp(tid,date,slot)};
  if(o.comp)return openDone(o);
  if(canComplete(o)&&t.tough)return gdOpen(o);
  if(canComplete(o))return openComplete(o);
  const s=status(o);
  openSheet(`${editPill(t.id)}<h3>${esc(t.emoji)} ${esc(t.name)}</h3><p class="muted">${relDay(date)} at ${fmtTime(slot)}</p>
   ${stepsBox(t)}${filesBox(t)}
   <p>${s==='missed'?'This one was missed. You can only tick off today\'s and yesterday\'s tasks.':'This one isn\'t due yet. You can tick it off on the day.'}</p>
   <div class="btns"><button class="btn ghost" onclick="closeSheet()">OK</button>${s!=='missed'?`<button class="btn ghost" onclick="editTask('${t.id}')">Edit this task</button>`:''}</div>`,null,keep);
  STEP_REFRESH=()=>tapOcc(tid,date,slot,true);
}

/* ---------- Get it done (tough tasks) ---------- */
const DREAD=['🙂','😐','😕','😣','😫'];
const DREAD_W=['Barely','A bit','Some','A lot','Heaps'];
const HARD=[['big','Too big'],['start','Don\'t know where to start'],['boring','Boring'],['worry','Worried how it\'ll go'],['tired','Too tired'],['person','Involves someone I\'d rather avoid'],['nope','Just don\'t want to']];
const HARD_TIP={big:'Shrink it. You only need the first small step, not the whole thing.',start:'Pick the smallest possible first move. Opening the file or getting the gear out counts.',boring:'Pair it with something: music, a podcast or a coffee. Make it less boring.',worry:'Done badly beats not done. You can tidy it up after.',tired:'Do the 5-minute version today. Something is better than nothing.',person:'Just write the first sentence of what you\'ll say. That\'s the hard part.',nope:'Fair enough. You don\'t have to want to. Just do 10 minutes, then decide.'};
let G=null,GT=null;
function gdKey(o){return o.task.id+'|'+o.date+'|'+o.slot}
function gdRec(){return S.data.tough[G.key]}
function gdOpen(o){
  STEP_REFRESH=null;
  const key=gdKey(o);
  if(!S.data.tough[key])S.data.tough[key]={dread:0,reasons:[],first:'',steps:(o.task.steps||[]).map(()=>false),mins:0,after:0};
  const r=S.data.tough[key];
  while(r.steps.length<(o.task.steps||[]).length)r.steps.push(false);
  const tk=o.task;if(r.steps.some(Boolean)&&tk.steps){tk.stepDone=tk.stepDone||{};r.steps.forEach((v,i)=>{if(v&&tk.steps[i])tk.stepDone[tk.steps[i]]=true});r.steps=r.steps.map(()=>false);save()}
  G={o,key,step:r.dread?1:0,mins:10};
  renderGD(false);
}
function gdSave(){save()}
/* steps live on the task, so ticks carry over from day to day until the list is done */
function stepOn(t,i){return !!(t.stepDone&&t.stepDone[t.steps[i]])}
function stepCount(t){return (t.steps||[]).filter((x,i)=>stepOn(t,i)).length}
function nextStepOf(t){return (t.steps||[]).find((x,i)=>!stepOn(t,i))}
let STEP_REFRESH=null;
function toggleStep(tid,i){const t=task(tid);if(!t||!t.steps||!t.steps[i])return;t.stepDone=t.stepDone||{};const k=t.steps[i];if(t.stepDone[k])delete t.stepDone[k];else t.stepDone[k]=true;save();try{render()}catch(e){}
  if(stepCount(t)===t.steps.length)toast('All steps done 🎉');
  if(STEP_REFRESH)STEP_REFRESH();else if(G&&G.o.task.id===tid){if(GT){gdTimerPaint();const el=document.getElementById('gdsteps');if(el)el.innerHTML=gdSteps()}else renderGD()}}
function resetSteps(tid){const t=task(tid);if(!t)return;t.stepDone={};save();try{render()}catch(e){}if(STEP_REFRESH)STEP_REFRESH();else if(G&&G.o.task.id===tid)renderGD()}
function stepsRefresh(tid,focus){
  sheetRefresh(tid);
  if(focus){const el=document.getElementById('addstep');if(el)el.focus()}
}
function addStep(tid){
  const t=task(tid),el=document.getElementById('addstep');if(!t||!el)return;
  const v=el.value.trim();if(!v)return el.focus();
  t.steps=t.steps||[];
  if(t.steps.includes(v)){toast('That step is already on the list');return}
  if(t.steps.length>=25){toast('That\'s a lot of steps. Finish a few first 🌿');return}
  t.steps.push(v);save();stepsRefresh(tid,true);
}
function stepsBox(t){
  if(!t.tough&&!(t.steps&&t.steps.length))return '';
  t.steps=t.steps||[];
  const n=stepCount(t),all=t.steps.length&&n===t.steps.length;
  const add=`<div class="row" style="gap:8px;padding:8px 0 4px${t.steps.length?';border-top:1px solid var(--line)':''}"><input class="inp" id="addstep" style="margin:0;flex:1" placeholder="${t.steps.length?'Add another step':'e.g. Renew ABN'}" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();addStep('${t.id}')}"><button class="btn ghost sm" style="width:auto;margin:0;flex:none" onclick="addStep('${t.id}')">+ Add</button></div>`;
  if(!t.steps.length)return `<label class="f">Break it into small steps</label><div class="card" style="padding:6px 12px">${add}</div>`;
  return `<label class="f">Your steps · ${n} of ${t.steps.length} done</label><div class="card" style="padding:6px 12px">${t.steps.map((st,i)=>{const on=stepOn(t,i);return `<button class="row" style="width:100%;text-align:left;padding:9px 0;gap:10px;${i<t.steps.length-1?'border-bottom:1px solid var(--line)':''}" onclick="toggleStep('${t.id}',${i})"><span class="check" style="margin:0;flex:none;${on?'background:var(--coral);border-color:var(--coral);color:#fff':''}">${on?'✓':''}</span><span style="${on?'text-decoration:line-through;color:var(--muted)':''}">${esc(st)}</span></button>`}).join('')}
   ${all?`<div class="row between small" style="padding:8px 0 4px"><span>🎉 The whole list is done.</span><button class="btn ghost sm" style="width:auto;margin:0" onclick="resetSteps('${t.id}')">Start it again</button></div>`:''}${add}</div>`;
}
function gdSteps(){return stepsBox(G.o.task)+filesBox(G.o.task)}
function renderGD(keep=true){
  if(!G)return;
  const t=G.o.task,r=gdRec(),st=G.step;
  let h=`${editPill(t.id)}<h3>😬 ${esc(t.name)}</h3><div class="muted small" style="margin-top:-8px">Tough one · ${relDay(G.o.date)} · ${fmtTime(G.o.slot)}${r.mins?' · '+r.mins+' min done so far':''}</div>`;
  if(st===0){
    h+=gdSteps();

      <div class="row between tiny muted" style="margin-top:4px"><span>${DREAD_W[0]}</span><span>${DREAD_W[4]}</span></div>
      <label class="f">What's making it hard? (pick any)</label><div class="chips">${HARD.map(([k,l])=>`<button class="chip ${r.reasons.includes(k)?'on':''}" onclick="gdReason('${k}')">${l}</button>`).join('')}</div>
      <div class="btns"><button class="btn" ${r.dread?'':'disabled'} onclick="G.step=1;renderGD(false)">Next</button><button class="btn sec2" onclick="gdBit()">🌿 Done my bit for today</button><button class="btn ghost" onclick="closeSheet()">Not now</button></div>`;
  } else if(st===1){
    const tips=r.reasons.map(k=>HARD_TIP[k]).filter(Boolean);
    const nextStep=nextStepOf(t);
    if(nextStep&&(!r.first||(t.steps||[]).some((x,i)=>x===r.first&&stepOn(t,i)))){r.first=nextStep;gdSave()}
    h+=tips.length?`<div class="card" style="background:var(--sunSoft);margin-top:12px">${tips.map(x=>`<div class="small" style="padding:3px 0">💡 ${esc(x)}</div>`).join('')}</div>`:'';
    if(r.dread>=4)h+=`<button class="banner" style="margin:0 0 6px" onclick="wtStart()">🧭 <span><b>Feeling really stuck?</b> Work through what's bugging you first.</span></button>`;
    h+=`<div class="serif" style="font-size:19px;margin:14px 0 4px">Shrink it</div><p class="small" style="margin-top:0">What's the very first step? Make it small enough to do in 2 minutes.</p>
      <input class="inp" value="${esc(r.first)}" placeholder="e.g. Open the email and write one line" oninput="gdRec().first=this.value;gdSave()">
      ${gdSteps()}
      <label class="f">Now just do a little bit. How long?</label><div class="chips">${[5,10,15,25].map(m=>`<button class="chip ${G.mins===m?'on':''}" onclick="G.mins=${m};renderGD()">${m} min</button>`).join('')}</div>
      <div class="tiny muted" style="margin-top:6px">When the timer ends you're allowed to stop. Most of the time you'll keep going.</div>
      <div class="btns"><button class="btn" onclick="gdStartTimer()">▶ Start ${G.mins} minutes</button><button class="btn ghost" onclick="G.step=3;renderGD(false)">It's already done ✓</button><button class="btn ghost" onclick="gdBit()">🌿 Done my bit for today</button><button class="btn ghost" onclick="G.step=0;renderGD(false)">Back</button></div>`;
  } else if(st===2){
    h+=`<div style="text-align:center;margin-top:10px" id="gdring"></div>
      ${r.first?`<div class="card" style="text-align:center;margin-top:6px"><div class="tiny muted">First step</div><div class="serif" style="font-size:17px">${esc(r.first)}</div></div>`:''}
      <div id="gdsteps">${gdSteps()}</div>
      <div class="btns" id="gdbtns"></div>`;
  } else if(st===4){
    h+=`<div class="card" style="text-align:center;margin-top:10px;background:var(--sunSoft)"><div style="font-size:34px">🌿</div><div class="serif" style="font-size:19px">Today's bit, done</div><div class="small muted">You don't have to finish it all today. Showing up and moving it forward counts.${r.mins?' '+r.mins+' min on it today.':''}</div></div>
      ${gdSteps()}
      <label class="f">What did you get done? (optional)</label><input class="inp" value="${esc(G.bitNote||'')}" placeholder="e.g. Rang the insurance mob, waiting on a quote" oninput="G.bitNote=this.value">
      <div class="btns"><button class="btn" onclick="gdBitSave()">Mark today done ✓</button><button class="btn ghost" onclick="G.step=G.back||0;renderGD(false)">Back</button></div>`;
  } else {
    h+=`<div class="serif" style="font-size:19px;margin:14px 0 4px">How was it, really?</div><p class="small" style="margin-top:0">Compared with how much you were dreading it.</p>
      <div class="moods">${DREAD.map((e,i)=>`<button class="${r.after===i+1?'on':''}" onclick="gdRec().after=${i+1};gdSave();renderGD()">${e}</button>`).join('')}</div>
      <div class="row between tiny muted" style="margin-top:4px"><span>Easy</span><span>Awful</span></div>
      ${r.after?`<div class="card" style="text-align:center;margin-top:14px"><div style="font-size:30px">${DREAD[(r.dread||3)-1]} → ${DREAD[r.after-1]}</div><div class="small">${r.after<(r.dread||3)?'Not as bad as it seemed. Remember that next time.':'Tough, and you did it anyway. That\'s the bit that counts.'}</div></div>`:''}
      <div class="btns"><button class="btn" ${r.after?'':'disabled'} onclick="gdFinish()">Finish 💪</button><button class="btn ghost" onclick="G.step=1;renderGD(false)">Back</button></div>`;
  }
  openSheet(h,gdOnClose,keep);
  if(st===2)gdTimerPaint();
}
function gdReason(k){const r=gdRec(),i=r.reasons.indexOf(k);if(i>=0)r.reasons.splice(i,1);else r.reasons.push(k);gdSave();renderGD()}
function gdStartTimer(){
  G.step=2;GT={start:Date.now(),end:Date.now()+G.mins*60000,total:G.mins*60000,doneBeep:false};
  renderGD(false);
  GT.iv=setInterval(gdTimerPaint,500);
}
function gdElapsedMin(){return GT?Math.max(0,Math.round((Math.min(Date.now(),GT.end)-GT.start)/60000)):0}
function gdTimerPaint(){
  if(!GT||!G)return;
  const ring=document.getElementById('gdring'),btns=document.getElementById('gdbtns');if(!ring)return;
  const left=Math.max(0,GT.end-Date.now()),frac=1-left/GT.total;
  const mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000);
  const R=88,C=2*Math.PI*R;
  ring.innerHTML=`<svg width="210" height="210" viewBox="0 0 210 210"><circle cx="105" cy="105" r="${R}" fill="none" stroke="#E3ECE8" stroke-width="12"/>
    <circle cx="105" cy="105" r="${R}" fill="none" stroke="${left?'#5E8C83':'#4E9A78'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 105 105)"/>
    <text x="105" y="102" text-anchor="middle" font-size="40" font-weight="700" fill="#22302D" font-family="Noto Serif,Georgia,serif">${left?mm+':'+pad(ss):'Done'}</text>
    <text x="105" y="132" text-anchor="middle" font-size="13" fill="#6C7D78">${left?'just this long':'time\'s up'}</text></svg>`;
  if(!left&&!GT.doneBeep){GT.doneBeep=true;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  const key=left?'run':'end';
  if(btns&&btns.dataset.k!==key){btns.dataset.k=key;
    btns.innerHTML=left?`<button class="btn ghost" onclick="gdStop('done')">It's done ✓</button><button class="btn ghost" onclick="gdStop('bit')">🌿 Done my bit for today</button><button class="btn ghost" onclick="gdStop('pause')">Stop for now</button>`
      :`<button class="btn" onclick="gdStop('done')">It's done ✓</button><button class="btn sec2" onclick="gdStop('bit')">🌿 Done my bit for today</button><button class="btn ghost" onclick="gdMore()">Keep going, 10 more</button><button class="btn ghost" onclick="gdStop('pause')">Stop for now, come back later</button>`;}
}
function gdLog(){const r=gdRec();r.mins=(r.mins||0)+gdElapsedMin();if(GT){clearInterval(GT.iv);GT=null}gdSave()}
function gdMore(){gdLog();G.mins=10;gdStartTimer()}
function gdStop(how){
  gdLog();
  if(how==='done'){G.step=3;renderGD(false);return}
  if(how==='bit'){G.back=1;G.step=4;renderGD(false);return}
  const r=gdRec();G=null;closeSheet();render();
  toast(r.mins?`${r.mins} min done. That's real progress. Pick it up again later.`:'No worries. Come back to it when you\'re ready.');
}
function gdOnClose(){if(GT&&G)gdLog();if(GT){clearInterval(GT.iv);GT=null}}
function gdBit(){G.back=G.step;G.step=4;renderGD(false)}
function gdBitSave(){
  const r=gdRec(),o=G.o,t=o.task,note=(G.bitNote||'').trim();
  const summary={before:r.dread||0,after:0,mins:r.mins||0,reasons:r.reasons.slice(),partial:true};
  G=null;closeSheet();
  if(photoRequired(o.date)||t.type==='exercise'){openComplete(o);CF.tough=summary;CF.note=note;renderComplete();return}
  const n=new Date();
  S.data.completions.push({id:uid(),taskId:t.id,date:o.date,slot:o.slot,at:dk(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()),photoId:null,note,late:o.date<todayK()||undefined,tough:summary});
  delete S.data.tough[gdKey(o)];
  save();render();
  const nx=nextStepOf(t);

function gdFinish(){
  const r=gdRec(),o=G.o;
  const summary={before:r.dread||3,after:r.after||3,mins:r.mins||0,reasons:r.reasons.slice()};
  G=null;closeSheet();
  const t=o.task;
  if(photoRequired(o.date)||t.type==='exercise'){openComplete(o);CF.tough=summary;renderComplete();return}
  const n=new Date();
  S.data.completions.push({id:uid(),taskId:t.id,date:o.date,slot:o.slot,at:dk(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()),photoId:null,note:'',late:o.date<todayK()||undefined,tough:summary});
  delete S.data.tough[gdKey(o)];
  save();render();toast('You did the hard thing 💪');
}
function toughStats(){
  const all=S.data.completions.filter(c=>c.tough);if(!all.length)return null;
  const cs=all.filter(c=>!c.tough.partial&&c.tough.before&&c.tough.after);
  const avg=k=>cs.length?cs.reduce((a,c)=>a+c.tough[k],0)/cs.length:0;
  return {n:cs.length,bits:all.length-cs.length,before:avg('before'),after:avg('after'),mins:all.reduce((a,c)=>a+(c.tough.mins||0),0)};
}

/* ---------- complete flow ---------- */
const DEFAULT_EX=['Squats','Deadlifts','Bench press','Shoulder press','Lunges','Bent-over rows','Lat pulldown','Bicep curls','Tricep dips','Glute bridges','Leg press','Plank'];
let CF=null;
function exNames(){const set=new Set(DEFAULT_EX);S.data.completions.forEach(c=>(c.workout||[]).forEach(w=>w.ex&&set.add(w.ex)));return [...set]}
function lastWorkout(tid){const c=S.data.completions.filter(c=>c.taskId===tid&&c.workout&&c.workout.length).sort((a,b)=>b.at.localeCompare(a.at))[0];return c?c.workout:null}
function openComplete(o){
  const isEx=o.task.type==='exercise';
  const prev=isEx?lastWorkout(o.task.id):null;
  CF={o,photoId:null,note:'',workout:prev?prev.map(w=>({ex:w.ex,sets:w.sets,reps:w.reps,kg:w.kg})):(isEx?[{ex:'',sets:'',reps:'',kg:''}]:[])};

}
function renderComplete(){
  breathStop();

  const late=o.date<todayK(),early=o.date>todayK();

   <div class="muted small" style="margin-top:-8px">${relDay(o.date)} · ${fmtTime(o.slot)}${late?' · late':''}${early?' · ticking it off early':''}${t.notes?' · '+esc(t.notes):''}</div>`;

    html+=`<div class="card" style="margin-top:14px;padding:6px 10px"><div class="mantra">“${esc(ms[i])}”</div>
      <div class="row between"><button class="mv" onclick="CF.mi--;renderComplete()">‹</button><span class="tiny muted">Say it slowly, three times. Mean it.</span><button class="mv" onclick="CF.mi++;renderComplete()">›</button></div></div>`;

      :`<button class="btn sec2" style="padding:22px" onclick="cfPhoto()">📷 Take proof photo</button><div class="tiny muted" style="margin-top:6px">${t.type==='exercise'?'e.g. a gym selfie or the weights':t.type==='move'?'e.g. the view on your walk':'Something that shows you did it'}</div>`);

    html+=ph?`<label class="f">Photo</label><img class="photo-big" src="${ph}">`:`<button class="btn ghost sm" style="margin-top:14px" onclick="cfPhoto()">📷 Add a photo (optional)</button>`;

   ${wk?`<button class="small muted" style="text-decoration:underline;margin-top:4px" onclick="walkCancel()">Cancel this walk</button>`:''}</div>`;
  openSheet(html,null,true);

function cfPhoto(){
  const old=CF.photoId;
  takePhoto(id=>{if(!CF)return;if(old&&old!==id)deletePhoto(old);CF.photoId=id;renderComplete()});
}
function cfSave(){
  const o=CF.o;
  if(photoRequired(o.date)&&!CF.photoId){toast('Proof photo needed');return}
  const w=(CF.workout||[]).filter(x=>String(x.ex).trim()).map(x=>({ex:String(x.ex).trim(),sets:x.sets,reps:x.reps,kg:x.kg}));
  const n=new Date();
  const at=dk(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  const wk=walkFor(o);let walk;
  if(wk){walk={steps:walkSteps(wk),mins:walkMins(wk)};if(o.task.stepMode==='goal'&&o.task.stepGoal)walk.goal=o.task.stepGoal;delete S.data.walks[walkKey(o)]}
  S.data.completions.push({id:uid(),taskId:o.task.id,date:o.date,slot:o.slot,at,photoId:CF.photoId,note:CF.note.trim(),workout:w.length?w:undefined,late:o.date<todayK()||undefined,early:o.date>todayK()||undefined,tough:CF.tough||undefined,walk});
  const wasTough=!!CF.tough,CF0p=!!(CF.tough&&CF.tough.partial);if(wasTough)delete S.data.tough[o.task.id+'|'+o.date+'|'+o.slot];
  CF.saved=true;save();CF=null;closeSheet();render();
  if(wasTough){toast(CF0p?'Done for today 🌿':'You did the hard thing 💪');return}
  if(walk){toast('Walk done: '+fmtN(walk.steps)+' steps'+(walk.goal&&walk.steps>=walk.goal?' 🎉':' 🌿'));return}
  const w2=weekStats();
  toast(w2.done>=w2.total&&w2.total?'That\'s the whole week done 🌿':['Nice one ✓','Small step, done 🌿','Ticked off ✓','Good on you 🌊'][Math.floor(Math.random()*4)]);
}
function openDone(o,keep){

   ${c.walk?walkDoneCard(c.walk):''}

function viewCal(){
  const base=S.calMonth||(S.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1));

  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i),k=dk(d);

      bar=`<div class="bar" style="background:${col}"></div>`;
    } else bar='<div class="bar"></div>';

    <div class="card" style="padding:12px"><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>All done</span><span><i style="background:var(--sun)"></i>Some done</span><span><i style="background:var(--red)"></i>Missed</span><span><i style="background:var(--grey)"></i>Planned</span><span><i style="background:var(--coral);width:7px;height:7px;border-radius:50%"></i>Appointment</span></div></div>
    <div class="sec">${relDay(sel)}${sel!==tk&&sel!==dk(addDays(new Date(),1))&&sel!==dk(addDays(new Date(),-1))?'':' · '+fmtDate(sel)}</div>

    </div>`;
}
function calRewardRow(sel){

/* ---------- Rewards ---------- */
function giver(){return S.data.settings.giver||''}
function giverLine(k){const g=giver();
  if(k==='celebrate')return g?esc(g)+' has to deliver it. Snap a photo when it happens.':'Go treat yourself. You earned it, so actually take it.';
  if(k==='sec')return g?'Earned · waiting on '+esc(g):'Earned · go claim it';
  return g?'waiting on '+esc(g):'ready to claim'}
function nextReward(){
  const R=S.data.rewards;if(!R.length)return null;
  const cnt={};S.data.rewardsEarned.forEach(e=>{cnt[e.rewardId]=(cnt[e.rewardId]||0)+1});
  const min=Math.min(...R.map(r=>cnt[r.id]||0));
  return R.find(r=>(cnt[r.id]||0)===min);
}
function earnedCount(id){return S.data.rewardsEarned.filter(e=>e.rewardId===id).length}
function plannedFor(wk){const id=S.data.rewardPlan[wk];return id?S.data.rewards.find(r=>r.id===id)||null:null}
function rewardFor(wk){return plannedFor(wk)||nextReward()}
function weekLabel(wk){const a=parseDk(wk),b=addDays(a,6);return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MON[a.getMonth()].slice(0,3):'')+'–'+b.getDate()+' '+MON[b.getMonth()].slice(0,3)}
let PW=null;
function planWeek(wk){
  wk=wk||dk(weekStart(addDays(new Date(),7)));
  PW={week:wk,rewardId:S.data.rewardPlan[wk]||''};renderPW();
}
function renderPW(keep){

   ${R.map(r=>`<button class="item" style="${PW.rewardId===r.id?'outline:2.5px solid var(--coral)':''}" onclick="PW.rewardId='${r.id}';renderPW(true)"><div class="emo">${esc(r.emoji)}</div><div class="grow"><div class="t1">${esc(r.name)}</div>${r.notes?`<div class="t2">${esc(r.notes)}</div>`:''}</div></button>`).join('')}

  const e=S.data.rewardsEarned.find(x=>x.week===PW.week&&!x.givenAt);

function editStart(){
  const v=S.data.rewardsFrom||dk(weekStart(new Date()));
  openSheet(`<h3>When do rewards start?</h3><p class="small muted">Only 100% weeks from this week on count towards rewards. Pick any day in the starting week.</p>
   <input class="inp" type="date" id="rwst" value="${v}">
   <div class="btns"><button class="btn" onclick="const x=document.getElementById('rwst').value;if(x){S.data.rewardsFrom=dk(weekStart(parseDk(x)));save();closeSheet();render();toast('Rewards start the week of '+weekLabel(S.data.rewardsFrom))}">Save</button>
   <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);

function weekPerfect(wsK){let total=0,done=0;const ws=parseDk(wsK);for(let i=0;i<7;i++){const oc=occFor(dk(addDays(ws,i)));total+=oc.length;done+=oc.filter(o=>o.comp).length}return total>0&&done===total}
function evalRewards(){
  const from=S.data.rewardsFrom;if(!from)return null;
  let changed=false,newly=null;
  const cur=dk(weekStart(new Date()));
  const before=S.data.rewardsEarned.filter(e=>e.week<from&&!e.givenAt);
  if(before.length){S.data.rewardsEarned=S.data.rewardsEarned.filter(e=>!before.includes(e));changed=true}
  for(let w=from,i=0;w<=cur&&i<600;w=dk(addDays(parseDk(w),7)),i++){
    const rec=S.data.rewardsEarned.find(e=>e.week===w);
    const perf=weekPerfect(w);
    if(perf&&!rec){
      const r=rewardFor(w);if(!r)continue;
      const e={id:uid(),week:w,rewardId:r.id,name:r.name,emoji:r.emoji,notes:r.notes||'',earnedAt:todayK(),givenAt:null,photoId:null};
      S.data.rewardsEarned.push(e);changed=true;newly=e;
    } else if(!perf&&rec&&!rec.givenAt&&w===cur){
      S.data.rewardsEarned=S.data.rewardsEarned.filter(x=>x!==rec);changed=true;
    }
  }
  if(changed)save();
  return newly;
}
