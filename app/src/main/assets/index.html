<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady</title>
<style>
:root{
  --bg:#F2F6F4; --card:#FFFFFF; --ink:#22302D; --muted:#6C7D78; --line:#E1EAE6;
  --sun:#9C8FD0; --sunSoft:#ECE9F7; --coral:#5E8C83; --coralSoft:#DDEBE7;
  --green:#4E9A78; --greenSoft:#DEF0E6; --red:#B97A86; --redSoft:#F3E3E6; --grey:#D3DDD9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{padding-bottom:88px;background:linear-gradient(180deg,#DCEBE6 0,#EAF2EF 180px,#F2F6F4 420px) no-repeat,#F2F6F4;min-height:100vh}
.top h1,.sheet h3,.serif{font-family:"Noto Serif",Georgia,serif;font-weight:600}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:26px;margin:0;font-weight:750;letter-spacing:-.3px}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(30,70,62,.08)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(30,70,62,.07)}
.card h2{font-size:17px;margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--coral);color:#fff;font-weight:650;width:100%}
.btn.sec2{background:var(--sunSoft);color:#4E4580}
.btn.ghost{background:#E4EDEA;color:var(--ink)}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650}
.p-done{background:var(--greenSoft);color:var(--green)}
.p-due{background:var(--coralSoft);color:var(--coral)}
.p-up{background:#E8EFEC;color:var(--muted)}
.p-miss{background:var(--redSoft);color:var(--red)}
/* week card */
.week{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.ring text{font-weight:750}
.wkmsg{font-weight:650;font-size:16px}
.track{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.trow{display:grid;grid-template-columns:1fr repeat(7,22px);gap:6px;align-items:center;margin:6px 0;font-size:14px}
.trow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:18px;height:18px;border-radius:50%;margin:auto}
.d-done{background:var(--green)}
.d-miss{background:var(--red);opacity:.85}
.d-due{border:2.5px solid var(--coral)}
.d-fut{background:var(--grey)}
.d-part{background:var(--sun)}
.dhead{font-size:11px;color:var(--muted);text-align:center;font-weight:650}
.dhead.today{color:var(--coral)}
/* task items */
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);margin-bottom:10px;box-shadow:0 1px 3px rgba(30,70,62,.07);width:100%;text-align:left}
.emo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none;background:var(--sunSoft)}
.item.done .emo{background:var(--greenSoft)}
.item.missed .emo{background:var(--redSoft)}
.item .grow{flex:1;min-width:0}
.item .t1{font-weight:650}
.item .t2{font-size:13px;color:var(--muted)}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:#eee}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--coralSoft);color:#2F5049;margin-bottom:14px;font-size:14px;width:100%;text-align:left}
.banner.sun{background:var(--sunSoft);color:#4E4580}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px 6px;font-weight:600;flex:1}
nav button.on{color:var(--coral)}
nav svg{width:24px;height:24px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(20,45,40,.32);z-index:10;display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--grey);margin:0 auto 12px}
.sheet.noanim{animation:none}
.sheet h3{margin:4px 0 14px;font-size:21px}
label.f{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none}
.inp:focus{border-color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff}
.emopick{display:flex;flex-wrap:wrap;gap:6px}
.emopick button{width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:21px}
.emopick button.on{border-color:var(--coral);background:var(--coralSoft)}
.timerow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.timerow .inp{flex:1}
.x{width:40px;height:40px;border-radius:12px;background:#E4EDEA;font-size:18px;flex:none}
.photo-big{width:100%;border-radius:16px;display:block;margin:6px 0 10px;max-height:55vh;object-fit:contain;background:#000}
.btns{display:grid;gap:10px;margin-top:18px}
.wo{display:grid;grid-template-columns:1fr 52px 52px 62px 36px;gap:6px;margin-bottom:6px}
.wo .inp{padding:10px 8px;font-size:15px}
.wo .x{width:36px;height:42px}
.whead{display:grid;grid-template-columns:1fr 52px 52px 62px 36px;gap:6px;font-size:11px;color:var(--muted);font-weight:650;padding:0 4px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding:4px 0}
.cell{aspect-ratio:1/1.08;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:600;position:relative}
.cell.out{opacity:.35}
.cell.sel{outline:2.5px solid var(--coral)}
.cell.today{background:var(--coralSoft)}
.cell .bar{width:60%;height:5px;border-radius:9px}
.cell .gf{position:absolute;top:2px;left:4px;font-size:10px}
.cell .ap{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:5px;border-radius:9px;display:inline-block}
/* hold */
.hold{position:relative;overflow:hidden;width:100%;padding:18px;border-radius:16px;background:var(--redSoft);color:var(--red);font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(185,122,134,.25)}
.hold span{position:relative}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:30;max-width:88vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.onb{min-height:100vh}
.starter{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#fff;border-radius:16px;margin-bottom:10px;border:2px solid transparent}
.starter.on{border-color:var(--coral)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--grey);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;margin-top:9px}
.starter.on .check{background:var(--coral);border-color:var(--coral)}
.tier{width:30px;height:30px;border-radius:10px;background:var(--sunSoft);color:#4E4580;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.mv{width:32px;height:30px;border-radius:9px;background:#E4EDEA;font-size:13px;flex:none}
.mv:disabled{opacity:.3}
.rbig{display:flex;gap:14px;align-items:center}
.breath{width:210px;height:210px;margin:18px auto 8px;position:relative;display:grid;place-items:center}
.breath .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#E8F2EF,#A9CCC3 60%,#7FAEA3);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 0 40px rgba(94,140,131,.35)}
.breath .lbl{position:relative;text-align:center;color:#1F3A35}
.breath .lbl b{display:block;font-size:22px;font-family:"Noto Serif",Georgia,serif;font-weight:600}
.mantra{font-family:"Noto Serif",Georgia,serif;font-size:22px;line-height:1.4;text-align:center;padding:18px 10px;color:#2F5049}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:28px;padding:8px 0;border-radius:14px;background:var(--bg);border:2px solid transparent}
.moods button.on{border-color:var(--coral);background:var(--coralSoft)}
.help a{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.help a:last-child{border-bottom:0}
.help a b{color:var(--coral)}
.recbtn{width:88px;height:88px;border-radius:50%;background:var(--coral);color:#fff;font-size:34px;display:inline-grid;place-items:center;box-shadow:0 6px 18px rgba(94,140,131,.35)}
.recbtn.on{background:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,122,134,.5)}50%{box-shadow:0 0 0 16px rgba(185,122,134,0)}}
.toggle{width:50px;height:30px;border-radius:99px;background:var(--grey);position:relative;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:23px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="ov"></div>
<script>
'use strict';
const BR = window.Android || null;
const S = {data:null, tab:'today', calMonth:null, calSel:null, sheetOpen:false, onClose:null};

/* ---------- helpers ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDk=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const todayK=()=>dk(new Date());
const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return (h%12||12)+(m?':'+pad(m):'')+(h<12?'am':'pm')}
function fmtDate(k,withDow=true){const d=parseDk(k);return (withDow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()].slice(0,3)}
function relDay(k){const t=todayK();if(k===t)return 'Today';if(k===dk(addDays(new Date(),1)))return 'Tomorrow';if(k===dk(addDays(new Date(),-1)))return 'Yesterday';return fmtDate(k)}
function daysSummary(days){const s=[...days].sort((a,b)=>((a+6)%7)-((b+6)%7));if(s.length===7)return 'Every day';if(s.length===5&&[1,2,3,4,5].every(x=>s.includes(x)))return 'Weekdays';if(s.length===2&&s.includes(0)&&s.includes(6))return 'Weekends';return s.map(d=>DOW[d]).join(', ')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function slotMin(s){const [h,m]=s.split(':').map(Number);return h*60+m}

/* ---------- data ---------- */
function defaultData(){return {version:1,onboarded:false,
  settings:{name:'',nagMinutes:30,nagMax:4,photoProof:false,photoOffFrom:null,vitdTarget:'',lastBackup:null,giver:''},
  tasks:[],completions:[],records:[],appointments:[],rewards:[],rewardsEarned:[],rewardsFrom:null,rewardPlan:{},moods:[],mantras:[],journal:[],wt:[],tough:{}}}
function load(){
  let raw=null;
  try{raw=BR?BR.loadData():localStorage.getItem('th_data')}catch(e){}
  let d=null;try{d=raw?JSON.parse(raw):null}catch(e){}
  const def=defaultData();
  S.data=Object.assign(def,d||{});
  S.data.settings=Object.assign(defaultData().settings,(d&&d.settings)||{});
  if(!S.data.rewardPlan)S.data.rewardPlan={};
  if(!S.data.wt)S.data.wt=[];
  if(!S.data.tough)S.data.tough={};
  for(const t of S.data.tasks){if(!t.repeat)t.repeat=t.days&&t.days.length===7?'daily':'weekly';if(!t.days)t.days=[];if(!t.start)t.start=todayK()}
}
function save(){
  const j=JSON.stringify(S.data);
  try{ if(BR){BR.saveData(j);BR.reschedule()} else localStorage.setItem('th_data',j) }
  catch(e){toast('Could not save: '+e)}
}
function task(id){return S.data.tasks.find(t=>t.id===id)}

/* photo proof: on, or switched off but not yet in effect */
function photoRequired(dateK){const s=S.data.settings;return s.photoProof||(s.photoOffFrom&&dateK<s.photoOffFrom)}
function photoPending(){const s=S.data.settings;return !s.photoProof&&s.photoOffFrom&&todayK()<s.photoOffFrom}

/* ---------- schedule maths ---------- */
function diffDays(a,b){const x=parseDk(a),y=parseDk(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5)}
function occurs(t,k){
  const st=t.start||k;
  if(k<st)return false;
  if(t.end&&k>=t.end)return false;
  if(t.until&&k>t.until)return false;
  const d=parseDk(k),w=d.getDay(),r=t.repeat||'weekly';
  if(r==='none')return k===st;
  if(r==='daily')return true;
  if(r==='weekly')return t.days.includes(w);
  if(r==='fortnightly'){if(!t.days.includes(w))return false;return Math.floor(diffDays(dk(weekStart(parseDk(st))),dk(weekStart(d)))/7)%2===0}
  if(r==='monthly'){const sd=parseDk(st).getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(sd,last)}
  if(r==='everyN'){const n=Math.max(1,parseInt(t.every)||2);return diffDays(st,k)%n===0}
  return false;
}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function scheduleSummary(t){
  const r=t.repeat||'weekly';let s;
  if(r==='none')s='One-off · '+relDay(t.start);
  else if(r==='daily')s='Every day';
  else if(r==='weekly')s=daysSummary(t.days);
  else if(r==='fortnightly')s='Fortnightly · '+daysSummary(t.days);
  else if(r==='monthly')s='Monthly on the '+ordinal(parseDk(t.start).getDate());
  else s='Every '+(parseInt(t.every)||2)+' days';
  if(r!=='none'&&t.start>todayK())s+=' · from '+fmtDate(t.start,false);
  if(r!=='none'&&t.until)s+=' · until '+fmtDate(t.until,false);
  return s;
}
function isFinished(t){const tk=todayK();return (t.repeat==='none'&&t.start<tk)||(t.until&&t.until<tk)}
function findComp(tid,date,slot){return S.data.completions.find(c=>c.taskId===tid&&c.date===date&&c.slot===slot)}
function occFor(k){
  const w=parseDk(k).getDay(),out=[];
  for(const t of S.data.tasks){
    if(!t.active)continue;
    if(!occurs(t,k))continue;
    for(const slot of t.times)out.push({task:t,slot,date:k,comp:findComp(t.id,k,slot)});
  }
  out.sort((a,b)=>a.slot.localeCompare(b.slot));
  return out;
}
function status(o){
  if(o.comp)return 'done';
  const t=todayK();
  if(o.date<t)return 'missed';
  if(o.date>t)return 'future';
  return nowMin()>=slotMin(o.slot)?'due':'upcoming';
}
function canComplete(o){const y=dk(addDays(new Date(),-1));return !o.comp&&o.date>=y&&o.date<=todayK()}
function weekStats(){
  const ws=weekStart(new Date()),days=[];let total=0,done=0,dueSoFar=0;
  for(let i=0;i<7;i++){
    const k=dk(addDays(ws,i)),oc=occFor(k);
    days.push({k,oc});total+=oc.length;done+=oc.filter(o=>o.comp).length;
    dueSoFar+=oc.filter(o=>{const s=status(o);return s==='done'||s==='missed'||s==='due'}).length;
  }
  return {ws,days,total,done,dueSoFar};
}
function earliestStart(){let e=null;for(const t of S.data.tasks){if(t.start&&(!e||t.start<e))e=t.start}return e}
function streak(){
  let n=0;const tOcc=occFor(todayK());
  if(tOcc.length&&tOcc.every(o=>o.comp))n++;
  const e=earliestStart();if(!e)return n;
  let d=addDays(new Date(),-1);
  for(let i=0;i<1000;i++){
    const k=dk(d);if(k<e)break;
    const oc=occFor(k);
    if(oc.length){if(oc.every(o=>o.comp))n++;else break}
    d=addDays(d,-1);
  }
  return n;
}

/* ---------- photos ---------- */
const photoCbs={};
function takePhoto(cb){
  const req=uid();photoCbs[req]=cb;
  if(BR){BR.takePhoto(req);return}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,1000/Math.max(img.width,img.height));
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const id='p'+uid();try{localStorage.setItem('th_photo_'+id,c.toDataURL('image/jpeg',.7))}catch(e){toast('Phone storage is full');return}
      window.onPhotoTaken(req,id)};
    img.src=URL.createObjectURL(f)};
  inp.click();
}
window.onPhotoTaken=(req,id)=>{const cb=photoCbs[req];delete photoCbs[req];if(id&&cb)cb(id);else if(!id)toast('No photo taken')};
const PHC={};
function photoSrc(id){if(!id)return '';if(PHC[id])return PHC[id];let v='';try{v=BR?(BR.loadPhoto(id)||''):(localStorage.getItem('th_photo_'+id)||'')}catch(e){}if(v)PHC[id]=v;return v}
function deletePhoto(id){if(!id)return;delete PHC[id];try{BR?BR.deletePhoto(id):localStorage.removeItem('th_photo_'+id)}catch(e){}}

/* ---------- sheet ---------- */
function openSheet(html,onClose,keep){
  const ov=document.getElementById('ov');
  const old=ov.querySelector('.sheet'),top=keep&&old?old.scrollTop:0;
  ov.innerHTML='<div class="sheet'+(keep&&old?' noanim':'')+'" onclick="event.stopPropagation()"><div class="grab"></div>'+html+'</div>';
  if(top)ov.querySelector('.sheet').scrollTop=top;
  ov.classList.add('show');document.body.classList.add('noscroll');S.sheetOpen=true;S.onClose=onClose||null;
}
function closeSheet(){
  if(typeof breathStop==='function')breathStop();
  const ov=document.getElementById('ov');ov.classList.remove('show');ov.innerHTML='';
  document.body.classList.remove('noscroll');S.sheetOpen=false;

function ringSvg(pct,size=96){
  const r=size/2-9,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E3ECE8" stroke-width="10"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pct>=100?'#4E9A78':'#5E8C83'}" stroke-width="10" stroke-linecap="round"
     stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.4}" fill="#22302D">${pct}%</text></svg>`;
}
function dayCell(oc){
  if(!oc.length)return '<div></div>';
  const st=oc.map(status);
  if(st.every(s=>s==='done'))return '<div class="dot d-done"></div>';
  if(st.some(s=>s==='missed')&&st.some(s=>s==='done'))return '<div class="dot d-part"></div>';
  if(st.every(s=>s==='missed'))return '<div class="dot d-miss"></div>';
  if(st.some(s=>s==='due'||s==='upcoming'))return st.some(s=>s==='done')?'<div class="dot d-part"></div>':'<div class="dot d-due"></div>';
  return '<div class="dot d-fut"></div>';
}
function weekCard(){

  else if(w.done>=w.total){msg='Full week. Well done 🌿';sub=`All ${w.total} done. Take a moment to notice that.`}
  else if(w.done>=w.dueSoFar){msg='Steady and on track';sub=`${w.done} of ${w.total} done · ${w.total-w.done} to go this week`}
  else{const b=w.dueSoFar-w.done;msg=`${b} to catch up`;sub=`${w.done} of ${w.total} done. No stress, one small thing at a time.`}

  const ids=[];w.days.forEach(d=>d.oc.forEach(o=>{if(!ids.includes(o.task.id))ids.push(o.task.id)}));
  const rows=ids.map(id=>{const t=task(id);return `<div class="trow"><div class="nm">${esc(t.emoji)} ${esc(t.name)}</div>${w.days.map(d=>dayCell(d.oc.filter(o=>o.task.id===id))).join('')}</div>`}).join('');
  return `<div class="card"><div class="week">${ringSvg(pct)}<div><div class="small muted">This week</div><div class="wkmsg">${msg}</div><div class="small muted" style="margin-top:3px">${sub}</div>
    ${st>0?`<div class="small" style="margin-top:6px;font-weight:650">🔥 ${st}-day streak</div>`:''}
    ${(()=>{const nx=rewardFor(dk(w.ws)),got=S.data.rewardsEarned.find(e=>e.week===dk(w.ws));return got?`<div class="small" style="margin-top:6px">🎁 Earned: <b>${esc(got.name)}</b></div>`:nx&&dk(w.ws)>=S.data.rewardsFrom?`<button class="small" style="margin-top:6px;text-align:left;padding:0" onclick="go('rewards')">🎁 Hit 100% to unlock: <b>${esc(nx.name)}</b></button>`:''})()}</div></div>
    ${rows?`<div class="track"><div class="trow"><div></div>${heads}</div>${rows}</div>`:''}</div>`;
}
function occItem(o,showDate){

/* ---------- Get it done (tough tasks) ---------- */
const DREAD=['🙂','😐','😕','😣','😫'];
const DREAD_W=['Barely','A bit','Some','A lot','Heaps'];
const HARD=[['big','Too big'],['start','Don\'t know where to start'],['boring','Boring'],['worry','Worried how it\'ll go'],['tired','Too tired'],['person','Involves someone I\'d rather avoid'],['nope','Just don\'t want to']];
const HARD_TIP={big:'Shrink it. You only need the first small step, not the whole thing.',start:'Pick the smallest possible first move. Opening the file or getting the gear out counts.',boring:'Pair it with something: music, a podcast or a coffee. Make it less boring.',worry:'Done badly beats not done. You can tidy it up after.',tired:'Do the 5-minute version today. Something is better than nothing.',person:'Just write the first sentence of what you\'ll say. That\'s the hard part.',nope:'Fair enough. You don\'t have to want to. Just do 10 minutes, then decide.'};
let G=null,GT=null;
function gdKey(o){return o.task.id+'|'+o.date+'|'+o.slot}
function gdRec(){return S.data.tough[G.key]}
function gdOpen(o){
  const key=gdKey(o);
  if(!S.data.tough[key])S.data.tough[key]={dread:0,reasons:[],first:'',steps:(o.task.steps||[]).map(()=>false),mins:0,after:0};
  const r=S.data.tough[key];
  while(r.steps.length<(o.task.steps||[]).length)r.steps.push(false);
  G={o,key,step:r.dread?1:0,mins:10};
  renderGD(false);
}
function gdSave(){save()}
function gdSteps(){
  const t=G.o.task,r=gdRec();if(!(t.steps&&t.steps.length))return '';
  return `<label class="f">Your steps</label><div class="card" style="padding:6px 12px">${t.steps.map((st,i)=>`<button class="row" style="width:100%;text-align:left;padding:9px 0;gap:10px;${i<t.steps.length-1?'border-bottom:1px solid var(--line)':''}" onclick="gdTickStep(${i})"><span class="check" style="margin:0;${r.steps[i]?'background:var(--coral);border-color:var(--coral)':''}">${r.steps[i]?'✓':''}</span><span style="${r.steps[i]?'text-decoration:line-through;color:var(--muted)':''}">${esc(st)}</span></button>`).join('')}</div>`;
}
function gdTickStep(i){const r=gdRec();r.steps[i]=!r.steps[i];gdSave();if(GT){gdTimerPaint();const el=document.getElementById('gdsteps');if(el)el.innerHTML=gdSteps()}else renderGD()}
function renderGD(keep=true){
  if(!G)return;
  const t=G.o.task,r=gdRec(),st=G.step;
  let h=`<h3>😬 ${esc(t.name)}</h3><div class="muted small" style="margin-top:-8px">Tough one · ${relDay(G.o.date)} · ${fmtTime(G.o.slot)}${r.mins?' · '+r.mins+' min done so far':''}</div>`;
  if(st===0){
    h+=`<label class="f">How much are you dreading it?</label><div class="moods">${DREAD.map((e,i)=>`<button class="${r.dread===i+1?'on':''}" onclick="gdRec().dread=${i+1};gdSave();renderGD()">${e}</button>`).join('')}</div>
      <div class="row between tiny muted" style="margin-top:4px"><span>${DREAD_W[0]}</span><span>${DREAD_W[4]}</span></div>
      <label class="f">What's making it hard? (pick any)</label><div class="chips">${HARD.map(([k,l])=>`<button class="chip ${r.reasons.includes(k)?'on':''}" onclick="gdReason('${k}')">${l}</button>`).join('')}</div>
      <div class="btns"><button class="btn" ${r.dread?'':'disabled'} onclick="G.step=1;renderGD(false)">Next</button><button class="btn ghost" onclick="closeSheet()">Not now</button></div>`;
  } else if(st===1){
    const tips=r.reasons.map(k=>HARD_TIP[k]).filter(Boolean);
    const nextStep=(t.steps||[]).find((x,i)=>!r.steps[i]);
    if(!r.first&&nextStep)r.first=nextStep;
    h+=tips.length?`<div class="card" style="background:var(--sunSoft);margin-top:12px">${tips.map(x=>`<div class="small" style="padding:3px 0">💡 ${esc(x)}</div>`).join('')}</div>`:'';
    if(r.dread>=4)h+=`<button class="banner" style="margin:0 0 6px" onclick="wtStart()">🧭 <span><b>Feeling really stuck?</b> Work through what's bugging you first.</span></button>`;
    h+=`<div class="serif" style="font-size:19px;margin:14px 0 4px">Shrink it</div><p class="small" style="margin-top:0">What's the very first step? Make it small enough to do in 2 minutes.</p>
      <input class="inp" value="${esc(r.first)}" placeholder="e.g. Open the email and write one line" oninput="gdRec().first=this.value;gdSave()">
      ${gdSteps()}
      <label class="f">Now just do a little bit. How long?</label><div class="chips">${[5,10,15,25].map(m=>`<button class="chip ${G.mins===m?'on':''}" onclick="G.mins=${m};renderGD()">${m} min</button>`).join('')}</div>
      <div class="tiny muted" style="margin-top:6px">When the timer ends you're allowed to stop. Most of the time you'll keep going.</div>
      <div class="btns"><button class="btn" onclick="gdStartTimer()">▶ Start ${G.mins} minutes</button><button class="btn ghost" onclick="G.step=3;renderGD(false)">It's already done ✓</button><button class="btn ghost" onclick="G.step=0;renderGD(false)">Back</button></div>`;
  } else if(st===2){
    h+=`<div style="text-align:center;margin-top:10px" id="gdring"></div>
      ${r.first?`<div class="card" style="text-align:center;margin-top:6px"><div class="tiny muted">First step</div><div class="serif" style="font-size:17px">${esc(r.first)}</div></div>`:''}
      <div id="gdsteps">${gdSteps()}</div>
      <div class="btns" id="gdbtns"></div>`;
  } else {
    h+=`<div class="serif" style="font-size:19px;margin:14px 0 4px">How was it, really?</div><p class="small" style="margin-top:0">Compared with how much you were dreading it.</p>
      <div class="moods">${DREAD.map((e,i)=>`<button class="${r.after===i+1?'on':''}" onclick="gdRec().after=${i+1};gdSave();renderGD()">${e}</button>`).join('')}</div>
      <div class="row between tiny muted" style="margin-top:4px"><span>Easy</span><span>Awful</span></div>
      ${r.after?`<div class="card" style="text-align:center;margin-top:14px"><div style="font-size:30px">${DREAD[(r.dread||3)-1]} → ${DREAD[r.after-1]}</div><div class="small">${r.after<(r.dread||3)?'Not as bad as it seemed. Remember that next time.':'Tough, and you did it anyway. That\'s the bit that counts.'}</div></div>`:''}
      <div class="btns"><button class="btn" ${r.after?'':'disabled'} onclick="gdFinish()">Finish 💪</button><button class="btn ghost" onclick="G.step=1;renderGD(false)">Back</button></div>`;
  }
  openSheet(h,gdOnClose,keep);
  if(st===2)gdTimerPaint();
}
function gdReason(k){const r=gdRec(),i=r.reasons.indexOf(k);if(i>=0)r.reasons.splice(i,1);else r.reasons.push(k);gdSave();renderGD()}
function gdStartTimer(){
  G.step=2;GT={start:Date.now(),end:Date.now()+G.mins*60000,total:G.mins*60000,doneBeep:false};
  renderGD(false);

}
function gdElapsedMin(){return GT?Math.max(0,Math.round((Math.min(Date.now(),GT.end)-GT.start)/60000)):0}
function gdTimerPaint(){
  if(!GT||!G)return;
  const ring=document.getElementById('gdring'),btns=document.getElementById('gdbtns');if(!ring)return;
  const left=Math.max(0,GT.end-Date.now()),frac=1-left/GT.total;
  const mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000);
  const R=88,C=2*Math.PI*R;
  ring.innerHTML=`<svg width="210" height="210" viewBox="0 0 210 210"><circle cx="105" cy="105" r="${R}" fill="none" stroke="#E3ECE8" stroke-width="12"/>
    <circle cx="105" cy="105" r="${R}" fill="none" stroke="${left?'#5E8C83':'#4E9A78'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 105 105)"/>
    <text x="105" y="102" text-anchor="middle" font-size="40" font-weight="700" fill="#22302D" font-family="Noto Serif,Georgia,serif">${left?mm+':'+pad(ss):'Done'}</text>
    <text x="105" y="132" text-anchor="middle" font-size="13" fill="#6C7D78">${left?'just this long':'time\'s up'}</text></svg>`;
  if(!left&&!GT.doneBeep){GT.doneBeep=true;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  const key=left?'run':'end';
  if(btns&&btns.dataset.k!==key){btns.dataset.k=key;
    btns.innerHTML=left?`<button class="btn ghost" onclick="gdStop('done')">It's done ✓</button><button class="btn ghost" onclick="gdStop('pause')">Stop for now</button>`
      :`<button class="btn" onclick="gdStop('done')">It's done ✓</button><button class="btn sec2" onclick="gdMore()">Keep going, 10 more</button><button class="btn ghost" onclick="gdStop('pause')">Stop for now (that's progress)</button>`;}
}
function gdLog(){const r=gdRec();r.mins=(r.mins||0)+gdElapsedMin();if(GT){clearInterval(GT.iv);GT=null}gdSave()}
function gdMore(){gdLog();G.mins=10;gdStartTimer()}
function gdStop(how){
  gdLog();
  if(how==='done'){G.step=3;renderGD(false);return}
  const r=gdRec();G=null;closeSheet();render();
  toast(r.mins?`${r.mins} min done. That's real progress. Pick it up again later.`:'No worries. Come back to it when you\'re ready.');
}
function gdOnClose(){if(GT&&G)gdLog();if(GT){clearInterval(GT.iv);GT=null}}
function gdFinish(){
  const r=gdRec(),o=G.o;
  const summary={before:r.dread||3,after:r.after||3,mins:r.mins||0,reasons:r.reasons.slice()};
  G=null;closeSheet();
  const t=o.task;
  if(photoRequired(o.date)||t.type==='exercise'){openComplete(o);CF.tough=summary;renderComplete();return}
  const n=new Date();
  S.data.completions.push({id:uid(),taskId:t.id,date:o.date,slot:o.slot,at:dk(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()),photoId:null,note:'',late:o.date<todayK()||undefined,tough:summary});
  delete S.data.tough[gdKey(o)];

}
function toughStats(){
  const cs=S.data.completions.filter(c=>c.tough);if(!cs.length)return null;
  const avg=k=>cs.reduce((a,c)=>a+c.tough[k],0)/cs.length;
  return {n:cs.length,before:avg('before'),after:avg('after'),mins:cs.reduce((a,c)=>a+(c.tough.mins||0),0)};

     ${CF.workout.map((w,i)=>`<div class="wo"><input class="inp" list="exl" value="${esc(w.ex)}" placeholder="Exercise" oninput="CF.workout[${i}].ex=this.value">
       <input class="inp" inputmode="numeric" value="${esc(w.sets)}" oninput="CF.workout[${i}].sets=this.value">
       <input class="inp" inputmode="numeric" value="${esc(w.reps)}" oninput="CF.workout[${i}].reps=this.value">
       <input class="inp" inputmode="decimal" value="${esc(w.kg)}" oninput="CF.workout[${i}].kg=this.value">

/* ---------- Rewards ---------- */
function giver(){return S.data.settings.giver||''}
function giverLine(k){const g=giver();
  if(k==='celebrate')return g?esc(g)+' has to deliver it. Snap a photo when it happens.':'Go treat yourself. You earned it, so actually take it.';
  if(k==='sec')return g?'Earned · waiting on '+esc(g):'Earned · go claim it';
  return g?'waiting on '+esc(g):'ready to claim'}
function nextReward(){
  const R=S.data.rewards;if(!R.length)return null;
  const cnt={};S.data.rewardsEarned.forEach(e=>{cnt[e.rewardId]=(cnt[e.rewardId]||0)+1});
  const min=Math.min(...R.map(r=>cnt[r.id]||0));
  return R.find(r=>(cnt[r.id]||0)===min);
}
function earnedCount(id){return S.data.rewardsEarned.filter(e=>e.rewardId===id).length}
function plannedFor(wk){const id=S.data.rewardPlan[wk];return id?S.data.rewards.find(r=>r.id===id)||null:null}
function rewardFor(wk){return plannedFor(wk)||nextReward()}
function weekLabel(wk){const a=parseDk(wk),b=addDays(a,6);return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MON[a.getMonth()].slice(0,3):'')+'–'+b.getDate()+' '+MON[b.getMonth()].slice(0,3)}
let PW=null;
function planWeek(wk){
  wk=wk||dk(weekStart(addDays(new Date(),7)));
  PW={week:wk,rewardId:S.data.rewardPlan[wk]||''};renderPW();
}
function renderPW(keep){

   ${R.map(r=>`<button class="item" style="${PW.rewardId===r.id?'outline:2.5px solid var(--coral)':''}" onclick="PW.rewardId='${r.id}';renderPW(true)"><div class="emo">${esc(r.emoji)}</div><div class="grow"><div class="t1">${esc(r.name)}</div>${r.notes?`<div class="t2">${esc(r.notes)}</div>`:''}</div></button>`).join('')}

   <div class="btns"><button class="btn" onclick="savePW()">Save</button></div>`,null,keep);

function savePW(){
  if(PW.rewardId)S.data.rewardPlan[PW.week]=PW.rewardId;else delete S.data.rewardPlan[PW.week];
  let msg=PW.rewardId?'Reward set for '+weekLabel(PW.week):'Back to the ladder for that week';
  if(PW.rewardId&&(!S.data.rewardsFrom||PW.week<S.data.rewardsFrom)){S.data.rewardsFrom=PW.week;msg+=' (rewards now start that week)'}
  const e=S.data.rewardsEarned.find(x=>x.week===PW.week&&!x.givenAt);
  if(e&&PW.rewardId){const r=plannedFor(PW.week);Object.assign(e,{rewardId:r.id,name:r.name,emoji:r.emoji,notes:r.notes||''})}
  save();closeSheet();render();toast(msg);
}
function editStart(){
  const v=S.data.rewardsFrom||dk(weekStart(new Date()));
  openSheet(`<h3>When do rewards start?</h3><p class="small muted">Only 100% weeks from this week on count towards rewards. Pick any day in the starting week.</p>
   <input class="inp" type="date" id="rwst" value="${v}">
   <div class="btns"><button class="btn" onclick="const x=document.getElementById('rwst').value;if(x){S.data.rewardsFrom=dk(weekStart(parseDk(x)));save();closeSheet();render();toast('Rewards start the week of '+weekLabel(S.data.rewardsFrom))}">Save</button>
   <button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
}
function weekPerfect(wsK){let total=0,done=0;const ws=parseDk(wsK);for(let i=0;i<7;i++){const oc=occFor(dk(addDays(ws,i)));total+=oc.length;done+=oc.filter(o=>o.comp).length}return total>0&&done===total}
function evalRewards(){
  const from=S.data.rewardsFrom;if(!from)return null;
  let changed=false,newly=null;
  const cur=dk(weekStart(new Date()));
  const before=S.data.rewardsEarned.filter(e=>e.week<from&&!e.givenAt);
  if(before.length){S.data.rewardsEarned=S.data.rewardsEarned.filter(e=>!before.includes(e));changed=true}
  for(let w=from,i=0;w<=cur&&i<600;w=dk(addDays(parseDk(w),7)),i++){
    const rec=S.data.rewardsEarned.find(e=>e.week===w);
    const perf=weekPerfect(w);
    if(perf&&!rec){
      const r=rewardFor(w);if(!r)continue;
      const e={id:uid(),week:w,rewardId:r.id,name:r.name,emoji:r.emoji,notes:r.notes||'',earnedAt:todayK(),givenAt:null,photoId:null};
      S.data.rewardsEarned.push(e);changed=true;newly=e;
    } else if(!perf&&rec&&!rec.givenAt){
      S.data.rewardsEarned=S.data.rewardsEarned.filter(x=>x!==rec);changed=true;
    }
  }
  if(changed)save();
  return newly;
}

/* ---------- Work through it ---------- */
const WT_PROMPTS=[
 ['Say it out loud','What\'s bothering you? Say it out loud, just as it comes. It doesn\'t need to make sense yet.'],
 ['Again, more specific','Say it again, but narrower. What exactly is the problem? Leave out the extra noise.'],
 ['One thing, about you','Last time. Make it one single thing, and make it about you. Try starting with "The problem for me is…"']];
let WT=null,REC=null,WT_PENDING=false;
function nowStamp(){const n=new Date();return dk(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())}
function wtStart(o){
  closeSheet();
  WT={id:uid(),date:todayK(),at:nowStamp(),rounds:[0,1,2].map(()=>({audioId:'',text:''})),sol:{audioId:'',text:''},step:0,o:o||null,done:false};
  renderWT(false);
}
function wtSlot(){return WT.step<3?WT.rounds[WT.step]:WT.sol}
function wtHas(){return WT.rounds.some(r=>r.audioId||r.text.trim())||WT.sol.audioId||WT.sol.text.trim()}
function wtPersist(){
  if(!WT||!wtHas())return;
  const rec={id:WT.id,date:WT.date,at:WT.at,rounds:WT.rounds,sol:WT.sol,done:WT.done};
  const i=S.data.wt.findIndex(x=>x.id===WT.id);if(i>=0)S.data.wt[i]=rec;else S.data.wt.push(rec);
  save();
}
function wtDots(){const L=['1','2','3','Solve','Breathe'];return `<div class="row" style="gap:5px;margin:-6px 0 12px;flex-wrap:wrap">${L.map((l,i)=>`<span class="pill ${i<WT.step?'p-done':i===WT.step?'p-due':'p-up'}">${i<WT.step?'✓ ':''}${l}</span>`).join('')}</div>`}
function hearLink(r,label){if(!r||(!r.audioId&&!r.text))return '';return `<div class="tiny muted" style="margin-bottom:8px">${label}: ${r.text?'“'+esc(r.text)+'” ':''}${r.audioId?`<button class="tiny" style="color:var(--coral);text-decoration:underline;padding:0" onclick="playA('${r.audioId}')">▶ hear it</button>`:''}</div>`}
function recBox(slot){
  const on=REC&&REC.on;
  let h=`<div class="card" style="text-align:center;padding:20px 14px">`;
  if(on)h+=`<button class="recbtn on" onclick="recStop()">■</button><div style="margin-top:10px;font-weight:700" id="rect">Recording… 0:00</div><div class="tiny muted">Tap to stop</div>`;
  else if(slot.audioId)h+=`<div style="font-size:30px">🎙️</div><div class="small" style="margin:4px 0 10px">Recorded</div><div class="row" style="justify-content:center;gap:10px"><button class="btn sm sec2" onclick="playA('${slot.audioId}')">▶ Play back</button><button class="btn sm ghost" onclick="recStart()">Re-record</button></div>`;
  else h+=`<button class="recbtn" onclick="recStart()">🎙️</button><div style="margin-top:10px;font-weight:700">Tap to record</div><div class="tiny muted">Say it out loud</div>`;
  h+=`</div><label class="f">Or write it down too (optional)</label><textarea class="inp" rows="3" oninput="wtSlot().text=this.value;wtReady()" placeholder="${WT.step<3?'The problem is…':'One thing I can do is…'}">${esc(slot.text)}</textarea>`;
  return h;
}
function wtReady(){const b=document.getElementById('wtn');if(!b||!WT||WT.step>=4)return;const sl=wtSlot();b.disabled=!((sl.audioId||sl.text.trim())&&!(REC&&REC.on))}
function renderWT(keep=true){
  if(!WT)return;
  const st=WT.step;
  let h=`<h3>🧭 Work through it</h3>`+wtDots();
  if(st===0)h+=`<p class="small muted" style="margin-top:0">Get it out of your head. Say the problem out loud three times, each time more specific and more about you. Then find one thing you can do. Then breathe.</p>`;
  if(st<3){
    const [t,p]=WT_PROMPTS[st];
    h+=`<div class="serif" style="font-size:20px;margin:4px 0 4px">${st+1}. ${t}</div><p class="small" style="margin-top:0">${esc(p)}</p>`;
    if(st>0)h+=hearLink(WT.rounds[st-1],'Last time');
    h+=recBox(WT.rounds[st]);
  } else if(st===3){
    h+=`<div class="serif" style="font-size:20px;margin:4px 0 4px">Now, the solution</div><p class="small" style="margin-top:0">You've narrowed it down to one thing. What's one thing you can do about it? Small and doable beats perfect.</p>`;
    h+=hearLink(WT.rounds[2],'Your problem');
    h+=recBox(WT.sol);
    h+=`<button class="btn ghost sm" style="margin-top:10px" onclick="wtToTask()">+ Turn it into a task</button>`;
  } else {
    h+=`<div class="serif" style="font-size:20px;margin:4px 0 4px">Now breathe</div><p class="small" style="margin-top:0">You've named it and you've got a plan. Let your body catch up.</p>`+hearLink(WT.sol,'Your plan')+breathWidget('wt');
  }
  h+=`<div class="btns">${st<4?`<button class="btn" id="wtn" onclick="wtNext()">${st<3?'Next':'On to breathing'}</button>`:`<button class="btn" onclick="wtFinish()">Finish${WT.o?' and tick off':''}</button>`}
    ${st>0?`<button class="btn ghost" onclick="wtBack()">Back</button>`:`<button class="btn ghost" onclick="closeSheet()">Not now</button>`}</div>`;
  openSheet(h,wtCleanup,keep);
  wtReady();
}
function recStart(){
  if(BR){
    const r=BR.startRecording();
    if(r==='perm'){WT_PENDING=true;toast('Allow the microphone so you can record');return}
    if(r!=='ok'){toast('Couldn\'t start recording');return}
  }
  REC={on:true,t0:Date.now()};renderWT();
  REC.iv=setInterval(()=>{const el=document.getElementById('rect');if(!el||!REC)return;const s=Math.floor((Date.now()-REC.t0)/1000);el.textContent='Recording… '+Math.floor(s/60)+':'+pad(s%60)},500);
}
window.onMicPermission=g=>{if(g&&WT_PENDING){WT_PENDING=false;recStart()}else if(!g){WT_PENDING=false;toast('No microphone access. You can still write it down.')}};
function useRec(id){
  if(REC){clearInterval(REC.iv);REC=null}
  if(!WT)return;
  if(!id){toast('That was too short, try again');return}
  const sl=wtSlot();if(sl.audioId&&sl.audioId!==id)delAudio(sl.audioId);sl.audioId=id;wtPersist();
}
function recStop(){
  const id=BR?BR.stopRecording():'a'+uid();

}
window.onRecStopped=id=>{if(REC&&REC.on){useRec(id);if(WT&&S.sheetOpen)renderWT()}};
window.onAudioEnded=()=>{};
function playA(id){if(BR)BR.playAudio(id);else toast('▶ plays on the phone')}
function delAudio(id){if(!id)return;try{BR&&BR.deleteAudio(id)}catch(e){}}
function wtCleanup(){
  if(REC&&REC.on){clearInterval(REC.iv);REC=null;try{BR&&BR.cancelRecording()}catch(e){}}
  try{BR&&BR.stopAudio()}catch(e){}
  wtPersist();
}
function wtNext(){
  const sl=wtSlot();if(!(sl.audioId||sl.text.trim())){toast('Record it or write it first');return}
  try{BR&&BR.stopAudio()}catch(e){}
  WT.step++;wtPersist();renderWT(false);
}
function wtBack(){try{BR&&BR.stopAudio()}catch(e){}WT.step--;renderWT(false)}
function wtToTask(){
  wtPersist();
  const keep=WT;
  const name=(WT.sol.text.trim()||'My next step').slice(0,60);
  S.onClose=null;
  editTask(null,null,dk(addDays(new Date(),1)));

function wtFinish(){
  WT.done=true;wtPersist();

}
function wtView(id){

function wtDel(id){

function guessCountry(){
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  const lang=(navigator.language||'').toUpperCase();
  if(tz.startsWith('Australia/'))return 'AU';
  if(tz==='Pacific/Auckland'||tz==='Pacific/Chatham')return 'NZ';
  if(tz==='Europe/London')return 'GB';
  if(tz==='Europe/Dublin')return 'IE';
  if(/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|St_Johns|Regina|Moncton|Whitehorse|Yellowknife|Iqaluit|Glace_Bay|Goose_Bay|Swift_Current)/.test(tz)||lang.endsWith('-CA'))return 'CA';
  if(/^(America\/|Pacific\/Honolulu)/.test(tz)&&lang.endsWith('-US'))return 'US';
  const m=lang.match(/-([A-Z]{2})$/);if(m&&HELP[m[1]==='UK'?'GB':m[1]])return m[1]==='UK'?'GB':m[1];
  if(tz.startsWith('America/'))return 'US';
  return 'XX';
}

  breathStop();

  const phases=[['Breathe in',1],['Hold',1],['Breathe out',.55],['Hold',.55]];
  const rounds=S.br||4;let step=0,sec=4;
  go.disabled=true;go.textContent='Breathing…';
  const show=()=>{const [name,sc]=phases[step%4];orb.style.transform=`scale(${sc})`;lbl.innerHTML=`<b>${name}</b><span>${sec}</span><div class="tiny">Round ${Math.floor(step/4)+1} of ${rounds}</div>`};

  if(!pts.length)return '<p class="small muted">Check in on the Today screen and your mood shows up here over time.</p>';
  const x=i=>P+i/(days-1)*(W-P*2),y=v=>H-P-(v-1)/4*(H-P*2);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for(let v=1;v<=5;v++)s+=`<line x1="${P}" x2="${W-P/2}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EEEA"/><text x="2" y="${y(v)+5}" font-size="12">${MOODS[v-1]}</text>`;
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="#9C8FD0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p=>{s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4.5" fill="#fff" stroke="#5E8C83" stroke-width="2.5"/>`});
  s+=`<text x="${P}" y="${H-4}" font-size="10" fill="#6C7D78">${fmtDate(dk(addDays(end,-(days-1))),false)}</text><text x="${W-P/2}" y="${H-4}" font-size="10" fill="#6C7D78" text-anchor="end">today</text>`;
  return s+'</svg>';
}

  openSheet(`<h3>${existing?'Edit task':'New task'}</h3>
   <label class="f">Task name</label><input class="inp" value="${esc(TE.name)}" placeholder="e.g. Walk on the beach" oninput="TE.name=this.value">
   <label class="f">Icon</label><div class="emopick">${ems.map(e=>`<button class="${TE.emoji===e?'on':''}" onclick="TE.emoji='${e}';renderTE()">${e}</button>`).join('')}</div>
   <label class="f">Type</label><div class="chips">${TYPES.map(([k,l])=>`<button class="chip ${TE.type===k?'on':''}" onclick="TE.type='${k}';renderTE()">${l}</button>`).join('')}</div>
   ${{exercise:'Gym tasks let you log sets, reps and weights.',mantra:'Shows one of your mantras when you tick it off.',breathe:'Opens a guided breathing circle when you tick it off.'}[TE.type]?`<div class="tiny muted" style="margin-top:6px">${{exercise:'Gym tasks let you log sets, reps and weights.',mantra:'Shows one of your mantras when you tick it off.',breathe:'Opens a guided breathing circle when you tick it off.'}[TE.type]}</div>`:''}
   <label class="f">${r==='none'?'Date':'Starts'}</label><input class="inp" type="date" value="${TE.start}" ${existing?'':`min="${tk}"`} onchange="teStart(this.value)">
   <label class="f">Repeats</label><div class="chips">${REPEATS.map(([k,l])=>`<button class="chip ${r===k?'on':''}" onclick="teRepeat('${k}')">${l}</button>`).join('')}</div>
   ${rep}
   <label class="f">Reminder time${TE.times.length>1?'s':''}</label>
   ${TE.times.map((tm,i)=>`<div class="timerow"><input class="inp" type="time" value="${tm}" onchange="TE.times[${i}]=this.value">${TE.times.length>1?`<button class="x" onclick="TE.times.splice(${i},1);renderTE()">×</button>`:''}</div>`).join('')}
   <button class="btn ghost sm" onclick="TE.times.push('12:00');renderTE()">+ Another time</button>
   <div class="card" style="margin-top:16px;padding:12px 14px"><div class="row between"><div><b>😬 Tough one</b><div class="tiny muted">Not keen on it? Get step-by-step help to get it done.</div></div><button class="toggle ${TE.tough?'on':''}" onclick="TE.tough=!TE.tough;renderTE()"></button></div>
     ${TE.tough?`<label class="f">Break it into small steps (optional, one per line)</label><textarea class="inp" rows="4" placeholder="e.g.
Find the paperwork
Write the first line
Send it" oninput="TE.stepsText=this.value">${esc(TE.stepsText!=null?TE.stepsText:(TE.steps||[]).join('\n'))}</textarea>`:''}</div>
   <label class="f">Note (shows on the reminder)</label><input class="inp" value="${esc(TE.notes)}" placeholder="e.g. Leave the phone at home" oninput="TE.notes=this.value">
   ${existing?`<div class="row between" style="margin-top:16px"><div><b>Active</b><div class="tiny muted">Pause it without deleting</div></div><button class="toggle ${TE.active?'on':''}" onclick="TE.active=!TE.active;this.classList.toggle('on')"></button></div>`:''}
   <div class="btns"><button class="btn" onclick="saveTask()">Save</button>${existing?`<button class="btn danger" onclick="delTask('${TE.id}')">Delete task</button>`:''}</div>`,null,keep);
}
function teDay(d){const i=TE.days.indexOf(d);if(i>=0)TE.days.splice(i,1);else TE.days.push(d);renderTE()}
function teRepeat(k){TE.repeat=k;if((k==='weekly'||k==='fortnightly')&&!TE.days.length)TE.days=[parseDk(TE.start||todayK()).getDay()];renderTE()}
function teStart(v){if(!v)return;const old=TE.start;TE.start=v;
  if((TE.repeat==='weekly'||TE.repeat==='fortnightly')&&old&&TE.days.length===1&&TE.days[0]===parseDk(old).getDay())TE.days=[parseDk(v).getDay()];
  if(TE.until&&TE.until<v)TE.until='';
  renderTE()}
function saveTask(){
  if(!TE.name.trim()){toast('Give it a name');return}
  if(!TE.start){toast('Pick a date');return}
  if(!TE_EX&&TE.start<todayK()){toast('Pick today or a later date');return}
  if((TE.repeat==='weekly'||TE.repeat==='fortnightly')&&!TE.days.length){toast('Pick at least one day');return}
  if(TE.repeat==='everyN'){TE.every=parseInt(TE.every);if(!(TE.every>=1&&TE.every<=365)){toast('Enter how many days between');return}}
  TE.times=[...new Set(TE.times.filter(Boolean))].sort();
  if(!TE.times.length){toast('Add a time');return}
  TE.name=TE.name.trim();
  if(TE.repeat==='none'){TE.until=''}
  if(TE.stepsText!=null){TE.steps=TE.stepsText.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,15);delete TE.stepsText}
  if(!TE.tough){delete TE.tough}
  if(TE.id){const i=S.data.tasks.findIndex(x=>x.id===TE.id);S.data.tasks[i]=TE}
  else{TE.id=uid();TE.active=true;S.data.tasks.push(TE)}
  save();closeSheet();render();toast('Saved. Reminders are set');
  if(window.__afterTask){const f=window.__afterTask;window.__afterTask=null;f()}
}
function delTask(id){
  if(!confirmTap('dt'+id,'Tap again to delete'))return;
  const t=task(id);
  if(S.data.completions.some(c=>c.taskId===id)){t.end=todayK();t.active=false}  // keep history
  else S.data.tasks=S.data.tasks.filter(x=>x.id!==id);
  save();closeSheet();render();toast('Deleted');
}

/* ---------- Settings ---------- */
function openSettings(){
  const s=S.data.settings;
  let perm='';
  try{if(BR)perm=`<div class="small" style="margin-top:8px">${BR.notificationsEnabled()?'✅ Notifications allowed':'⚠️ Notifications blocked'} · ${BR.exactAlarmsAllowed()?'✅ On-time alarms':'⚠️ Alarms may be late'}</div>`}catch(e){}
  const ph=s.photoProof?`<div class="row between"><div><b>Photo proof is ON</b><div class="tiny muted">Every task needs a photo to tick off</div></div><span class="pill p-done">On</span></div>
      <button class="btn ghost sm" style="margin-top:12px" onclick="photoOffStep1()">Turn off photo proof…</button>`
    :photoPending()?`<div><b>Photo proof switches off tomorrow</b><div class="tiny muted">Changed your mind? It's not too late.</div></div><button class="btn" style="margin-top:12px" onclick="photoOn()">Keep photo proof on</button>`
    :`<div class="row between"><div><b>Photo proof is OFF</b><div class="tiny muted">Tasks tick off with one tap. Turn this on if you want proof.</div></div><span class="pill p-up">Off</span></div><button class="btn" style="margin-top:12px" onclick="photoOn()">Turn photo proof back on</button>`;
  let ver='';try{if(BR)ver=BR.appVersion()}catch(e){}
  openSheet(`<h3>Settings</h3>
   <div class="card"><label class="f" style="margin-top:0">Your name</label><input class="inp" value="${esc(s.name)}" placeholder="Your name" onchange="S.data.settings.name=this.value.trim();save();render()"></div>
   <div class="card"><h2>🔔 Reminders</h2><div class="small muted">If a task isn't ticked off, keep nudging every:</div>
     <div class="chips" style="margin-top:8px">${[15,30,60].map(m=>`<button class="chip ${s.nagMinutes===m?'on':''}" onclick="setS('nagMinutes',${m})">${m} min</button>`).join('')}</div>
     <div class="small muted" style="margin-top:12px">Extra nudges per task:</div>
     <div class="chips" style="margin-top:8px">${[2,4,6].map(m=>`<button class="chip ${s.nagMax===m?'on':''}" onclick="setS('nagMax',${m})">${m}</button>`).join('')}</div>
     ${perm}${BR?`<button class="btn ghost sm" style="margin-top:12px" onclick="Android.testNotification()">Send a test reminder</button>`:''}</div>
   <div class="card"><h2>📷 Photo proof</h2>${ph}</div>
   <div class="card"><h2>🌏 Country</h2><div class="small muted" style="margin-bottom:8px">Sets which support lines show in the Mind tab.</div>${countrySelect(country(),"setCountry(this.value)")}</div>
   <div class="card"><h2>🎁 Rewards</h2><label class="f" style="margin-top:0">Someone else gives the rewards? (optional)</label><input class="inp" value="${esc(s.giver||'')}" placeholder="Leave blank to treat yourself" onchange="S.data.settings.giver=this.value.trim();save();render()"></div>
   <div class="card"><h2>💾 Backup</h2><div class="small muted">Everything lives only on this phone, private to you. Save a backup file now and then (Google Drive, email it to yourself, etc.) so nothing's lost if the phone dies.</div>
     <div class="small" style="margin-top:8px">Last backup: <b>${s.lastBackup?fmtDate(s.lastBackup):'never'}</b></div>
     ${BR?`<div class="btns" style="margin-top:12px"><button class="btn sec2" onclick="Android.exportBackup()">Save backup file</button><button class="btn ghost" onclick="restoreAsk()">Restore from backup…</button></div>`
       :`<button class="btn sec2" style="margin-top:12px" onclick="browserExport()">Download backup</button>`}</div>
   <div class="tiny muted" style="text-align:center;margin-top:6px">Steady ${esc(ver)} · one small step at a time</div>`);
}
function setS(k,v){S.data.settings[k]=v;save();openSettings()}
function restoreAsk(){if(!confirmTap('rs','Restoring replaces everything on this phone. Tap again to choose a file'))return;Android.importBackup()}
window.onBackupDone=(kind,ok,msg)=>{
  if(kind==='export'&&ok){S.data.settings.lastBackup=todayK();save();toast('Backup saved ✓');if(S.sheetOpen)openSettings()}
  else if(!ok&&msg)toast(msg);
};
function browserExport(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S.data));a.download='trishas-health-backup.json';a.click();S.data.settings.lastBackup=todayK();save()}
function photoOn(){S.data.settings.photoProof=true;S.data.settings.photoOffFrom=null;save();openSettings();render();toast('Photo proof is on 📷')}
function photoOffStep1(){
  openSheet(`<h3>Turn off photo proof?</h3>
   <p>Photo proof is what makes ticking things off <i>count</i>. Before you switch it off, ask yourself: am I just annoyed right now?</p>
   <p class="small muted">If you go ahead it won't switch off until <b>tomorrow</b>, so today's tasks still need a photo.</p>
   <div class="btns"><button class="btn" onclick="openSettings()">Keep it on</button><button class="btn ghost" onclick="photoOffStep2()">I still want to turn it off</button></div>`);
}
let holdT=null;
function photoOffStep2(){
  openSheet(`<h3>Hold to confirm</h3><p class="muted">Press and hold for 5 seconds.</p>
   <div class="hold" id="hold"><div class="fill" id="hfill"></div><span id="htxt">Hold to turn off photo proof</span></div>
   <div class="btns"><button class="btn" onclick="openSettings()">Never mind, keep it on</button></div>`);
  const el=document.getElementById('hold'),fill=document.getElementById('hfill');
  let t0=0,raf=0;
  const stop=()=>{cancelAnimationFrame(raf);t0=0;fill.style.width='0';document.getElementById('htxt').textContent='Hold to turn off photo proof'};
  const tick=()=>{const p=Math.min(1,(Date.now()-t0)/5000);fill.style.width=(p*100)+'%';document.getElementById('htxt').textContent=p<1?'Keep holding… '+Math.ceil(5-p*5):'OK';if(p>=1){photoOffStep3();return}raf=requestAnimationFrame(tick)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();t0=Date.now();raf=requestAnimationFrame(tick)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
const PHRASE='I will still do my tasks';
function photoOffStep3(){
  openSheet(`<h3>Last step</h3><p>Type this to confirm:</p><p style="font-weight:700;font-size:18px">“${PHRASE}”</p>
   <input class="inp" id="phr" autocomplete="off" oninput="document.getElementById('phok').disabled=this.value.trim().toLowerCase().replace(/[.!]$/,'')!=='${PHRASE.toLowerCase()}'">
   <div class="btns"><button class="btn danger" id="phok" disabled onclick="photoOffDo()">Turn off from tomorrow</button><button class="btn" onclick="openSettings()">Keep it on</button></div>`);
}
function photoOffDo(){
  S.data.settings.photoProof=false;S.data.settings.photoOffFrom=dk(addDays(new Date(),1));
  save();openSettings();render();toast('Photo proof turns off tomorrow');
}

/* ---------- Onboarding ---------- */
let OB=null;
function viewOnboard(){
  if(!OB)OB={name:S.data.settings.name||'',picks:{0:true,1:true,2:true,3:false},times:{0:'17:30',1:'07:00',2:'21:00',3:'21:30'},mantra:''};
  const st=TEMPLATES.slice(0,4).map((tp,i)=>`<div class="starter ${OB.picks[i]?'on':''}">
    <button class="check" onclick="OB.picks[${i}]=!OB.picks[${i}];render()">${OB.picks[i]?'✓':''}</button>
    <div class="grow" style="flex:1"><div class="row between"><b>${tp.emoji} ${tp.name}</b><input class="inp" type="time" style="width:120px;padding:8px" value="${OB.times[i]}" onchange="OB.times[${i}]=this.value"></div>
    <div class="small muted" style="margin-top:4px">Every day${tp.notes?' · '+tp.notes:''}</div></div></div>`).join('');
  return `<div class="wrap onb"><div style="font-size:46px;margin-top:20px">🌿</div><h1 class="serif" style="font-size:30px;margin:6px 0" id="obhi">Hey ${OB.name?esc(OB.name):'there'}.</h1>
   <p class="muted" style="margin-top:0">This is your space to look after your headspace. Small things, most days. Gentle reminders, a quick mood check-in, and a treat when you have a full week. It's all private and stays on this phone.</p>
   <label class="f">What should I call you?</label><input class="inp" value="${esc(OB.name)}" placeholder="Your first name" autocomplete="given-name" oninput="OB.name=this.value.trim();document.getElementById('obhi').textContent='Hey '+(OB.name||'there')+'.'">
   <div class="sec">Pick a few small habits to start</div>${st}
   <div class="small muted">Start small. You can add more, or change anything, in the Plan tab.</div>
   <div class="sec">Where are you?</div>
   <div class="card">${countrySelect(OB.country||guessCountry(),"OB.country=this.value")}<div class="tiny muted" style="margin-top:8px">So the support lines in the app are the right ones for your country.</div></div>
   <div class="sec">Your first mantra (optional)</div>
   <div class="card"><input class="inp serif" style="font-size:17px" value="${esc(OB.mantra)}" placeholder="e.g. One step at a time." oninput="OB.mantra=this.value">
     <div class="tiny muted" style="margin-top:8px">Leave it blank and you'll get a few starter ones.</div></div>
   <button class="btn" style="margin:10px 0 30px;padding:16px" onclick="obFinish()">Let's begin →</button></div>`;
}
function obFinish(){
  const t=todayK();
  TEMPLATES.slice(0,4).forEach((tp,i)=>{if(!OB.picks[i])return;const x=JSON.parse(JSON.stringify(tp));x.id=uid();x.start=t;x.active=true;x.times=[OB.times[i]||tp.times[0]];S.data.tasks.push(x)});
  S.data.settings.name=OB.name||'';
  S.data.settings.country=OB.country||guessCountry();
  if(String(OB.mantra).trim())S.data.mantras.push({id:uid(),text:String(OB.mantra).trim()});
  S.data.onboarded=true;save();OB=null;S.tab='today';render();
  try{if(BR&&!BR.notificationsEnabled())BR.requestNotifications()}catch(e){}
}

/* ---------- open from notification ---------- */
window.openFromNotification=(tid,date,slot)=>{if(!S.data.onboarded)return;closeSheet();S.tab='today';render();if(tid&&date&&slot)tapOcc(tid,date,slot)};
window.reloadData=()=>{for(const k in PHC)delete PHC[k];load();render()};

/* ---------- boot ---------- */
load();render();
// keep "due now" labels fresh
setInterval(()=>{if(!S.sheetOpen)render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.sheetOpen)render()});
</script>
</body>
</html>
